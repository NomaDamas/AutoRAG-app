const totalFiles=()=>state.folders.filter(x=>x.selected).reduce((a,x)=>a+x.files,0);

function renderFooter(){if(state.step===steps.length-1){document.getElementById('footer').innerHTML=`<button class="back-btn" data-act="back" title="뒤로">${icon('chevron-left',15)}</button><div class="progress-dashes">${steps.map((_,i)=>`<button class="${i<state.step?'done ':''}${i===state.step?'active':''}" data-act="goto" data-value="${i}" title="${steps[i][1]}"></button>`).join('')}</div><button class="primary" data-act="finish">AutoRAG 열기 <span class="kbd">↵</span></button>`;return}const can=canNext();const labels=['시작하기','계속','계속','폴더로 계속','인덱싱 시작','계속','플랜 선택','계속'];document.getElementById('footer').innerHTML=`<button class="back-btn" data-act="back" ${state.step===0?'disabled':''}>${icon('chevron-left',15)}</button><div class="progress-dashes">${steps.map((_,i)=>`<button class="${i<state.step?'done ':''}${i===state.step?'active':''}" data-act="goto" data-value="${i}" title="${steps[i][1]}"></button>`).join('')}</div>${state.step===1&&!state.permissions.fda?'<button class="skip-link" data-act="skipPermission">나중에 설정</button>':''}<button class="primary" data-act="next" ${can?'':'disabled'}>${labels[state.step]} <span class="kbd">↵</span></button>`;}
function canNext(){const id=steps[state.step][0];if(id==='account')return state.signedIn;if(id==='folders')return state.folders.some(x=>x.selected);if(id==='embedding')return state.embed==='local'||state.cloudConsent;if(id==='model')return state.plan!=='byok'||state.modelVerified;return true;}

 folders:()=>`<section class="screen center"><div class="screen-copy"><span class="eyebrow">${icon('folder-search',12)} 인덱싱 범위</span><h1>AI가 읽을 폴더를 고르세요</h1><p>여기 선택한 폴더만 AI 검색에 포함됩니다. 범위는 나중에 추가하거나 줄일 수 있습니다.</p></div><div style="width:100%;max-width:760px;margin-top:19px"><div class="folder-head"><strong>추천 위치</strong><label><input type="checkbox" data-act="allFolders" ${state.folders.every(x=>x.selected)?'checked':''}> 모두 선택</label></div><div class="folder-grid">${state.folders.map(f=>`<div class="folder-card ${f.selected?'selected':''}" data-act="folder" data-value="${f.id}"><span class="check-box">${icon('check',12)}</span>${folderIcon(f.icon)}<div class="folder-info"><div class="folder-name">${f.name}${f.noise?'<span class="noise">잡음 많음</span>':''}</div><div class="folder-path">${f.path}</div><div class="folder-stats">${f.files.toLocaleString('ko-KR')}개 · ${f.size} · 약 ${f.time}분</div></div></div>`).join('')}<div class="folder-card add" data-act="addFolder">${icon('plus',15)}<span>다른 폴더 추가</span></div></div><div class="folder-summary"><div class="summary-main"><strong>${state.folders.filter(x=>x.selected).length}개 폴더 · ${totalFiles().toLocaleString('ko-KR')}개 파일 · ${totalSize()} GB</strong><small>node_modules · .git · 50 MiB 초과 파일은 자동으로 제외합니다.</small></div><div><div class="eta-row"><span>로컬 <b>약 ${eta('local')}분</b></span><span>클라우드 <b>약 ${eta('cloud')}분</b></span></div></div></div><div class="summary-warning ${eta('local')>120?'':'hidden'}">${icon('triangle-alert',12)} 범위가 넓습니다. 하위 폴더를 고르거나 클라우드 임베딩을 선택하면 첫 결과를 더 빨리 볼 수 있습니다.</div></div></section>`,
 embedding:()=>split(`<span class="eyebrow warn">${icon('lock',12)} 중요한 선택</span><h1>어디서<br>임베딩할까요?</h1><p>문서를 검색 가능한 의미 벡터로 바꾸는 위치입니다. 나중에 바꾸면 전체를 다시 인덱싱해야 합니다.</p><div class="copy-stat"><strong>${totalFiles().toLocaleString('ko-KR')}개</strong><span>선택한 파일</span><span>·</span><strong>${totalSize()} GB</strong></div><div class="reindex-note">${icon('triangle-alert',13)}<span>임베딩 모델이나 처리 위치를 바꾸면 incremental sync를 이어갈 수 없습니다.</span></div>`, `<div class="embed-wrap"><div class="embed-cards"><div class="embed-card ${state.embed==='local'?'selected':''}" data-act="embed" data-value="local"><div class="embed-icon">${icon('laptop',19)}</div><h3>이 Mac에서</h3><p>파일 본문이 Mac 밖으로 나가지 않습니다.</p><div class="metric-grid"><div class="metric"><small>예상 시간</small><b>약 ${eta('local')}분</b></div><div class="metric"><small>다운로드</small><b>약 0.6 GB</b></div><div class="metric"><small>프라이버시</small><b>로컬</b></div></div><ul class="bullets"><li>Apple Silicon GPU 사용</li><li>노트북은 전원 연결 권장</li></ul></div><div class="embed-card ${state.embed==='cloud'?'selected':''}" data-act="embed" data-value="cloud"><span class="recommended">Pro 전용</span><div class="embed-icon">${icon('cloud',19)}</div><h3>클라우드에서</h3><p>더 빠르게 처리하지만 선택한 문서 본문이 전송됩니다.</p><div class="metric-grid"><div class="metric"><small>예상 시간</small><b>약 ${eta('cloud')}분</b></div><div class="metric"><small>저장</small><b>하지 않음</b></div><div class="metric"><small>플랜</small><b>Pro 전용</b></div></div><ul class="bullets"><li>Mac 성능에 영향이 적음</li><li>처리 후 본문을 보관하지 않음</li></ul></div></div>${state.embed==='cloud'?`<label class="consent"><input type="checkbox" data-act="consent" ${state.cloudConsent?'checked':''}><span>선택한 폴더의 문서 본문이 임베딩 처리를 위해 AutoRAG 서버로 전송되는 것에 동의합니다. 처리 후 보관하지 않습니다.</span></label>`:''}<div class="action-row"><button class="primary" data-act="startIndex" ${state.embed==='cloud'&&!state.cloudConsent?'disabled':''}>${icon('play',13)} 인덱싱 시작</button></div></div>`),
 model:()=>split(`<span class="eyebrow">${icon('brain',12)} AI 모델</span><h1>${state.plan==='byok'?'사용할 모델을 연결하세요':'AI 모델은 준비됐어요'}</h1><p>${state.plan==='byok'?'감지된 연결을 사용하거나 provider와 API 키를 선택하세요.':'플랜에 맞는 답변 모델을 자동으로 구성합니다. 별도의 키 입력은 필요하지 않습니다.'}</p><div class="micro-note">${icon('lock',14)}<span>제품 구현 시 키는 Keychain에 보관합니다. 이 데모에는 실제 API 키를 입력하지 마세요.</span></div>`,state.plan!=='byok'?`<div class="model-box card"><header><div class="ok-circle">${icon('check',18)}</div><div><strong>AutoRAG 모델 준비 완료</strong><small>관리형 모델 · 자동 선택</small></div></header><div class="model-rows"><div class="model-row"><span>답변 모델</span><b>플랜 기본 모델</b></div><div class="model-row"><span>임베딩</span><b>${state.embed==='local'?'이 Mac':'클라우드'}</b></div></div><div class="action-row"><button class="quiet" data-act="switchByok">내 키로 연결하기 →</button></div></div>`:`<div><div class="detected"><div class="detected-title">감지 결과 예시</div><div class="detected-row"><span class="source-icon">${icon('key-round',14)}</span><div><strong>Anthropic API key</strong><small>환경변수 연결 예시</small></div><button class="secondary" data-act="useDetected" data-value="Anthropic">사용</button></div><div class="detected-row"><span class="source-icon">${icon('cpu',14)}</span><div><strong>Ollama</strong><small>로컬 runtime 예시</small></div><button class="secondary" data-act="useDetected" data-value="Ollama">사용</button></div></div><div class="card" style="padding:14px"><div class="provider-chips">${['Anthropic','OpenAI','OpenRouter','Google','Ollama','OpenAI 호환'].map(p=>`<button class="provider-chip ${state.provider===p?'selected':''}" data-act="provider" data-value="${p}">${p}</button>`).join('')}</div><div class="key-row"><input class="input" id="keyInput" type="password" placeholder="예시 키 입력 · 실제 키 사용 금지" value="${esc(state.key)}"><button class="secondary" data-act="verify">연결 확인</button></div><p style="font-size:10px;color:var(--muted)">${state.modelVerified?'✓ 데모 연결 완료 · 추천 모델 선택됨':'실제 네트워크 호출이나 키 저장은 하지 않습니다.'}</p><details><summary style="font-size:11px;color:var(--muted);cursor:pointer">고급 설정</summary><div class="model-row"><span>모델</span><b>provider 추천 모델</b></div><div class="model-row"><span>컨텍스트 / 추론 모드</span><b>모델 기본값</b></div></details></div></div>`),
 sources:()=>split(`<span class="eyebrow">${icon('plug-zap',12)} 데이터 소스</span><h1>연결된 곳도<br>함께 찾을까요?</h1><p>이미 설치되고 인증된 소스만 먼저 보여드립니다. 모두 선택하지 않아도 됩니다.</p><div class="micro-note">${icon('info',14)}<span>설명을 직접 쓰지 않아도 됩니다. 켜면 메타데이터로 초안을 만들어 드립니다.</span></div>`, `<div class="source-list">${state.sources.map(s=>`<div class="source-row"><span class="source-icon ${s.color}">${icon(s.icon,16)}</span><div class="source-main"><div class="source-name">${s.name} <span class="tag ${s.id==='mail'&&!state.permissions.fda?'req':''}">${s.id==='mail'&&!state.permissions.fda?'권한 필요':'감지됨'}</span></div><div class="source-detail">${s.detail}</div>${s.on?`<div class="source-description"><textarea data-source-input="${s.id}">${esc(s.desc)}</textarea><footer><span class="draft">✦ metadata 기반 초안 · 본문 미사용</span><button data-act="rewrite" data-value="${s.id}">${icon('wand-sparkles',11)} 다시 쓰기</button></footer></div>`:''}</div><button class="switch ${s.on?'on':''}" data-act="source" data-value="${s.id}" ${s.id==='mail'&&!state.permissions.fda?'disabled':''}></button></div>`).join('')}</div><div class="connect-more">준비가 필요한 소스는 나중에 Settings에서 연결할 수 있습니다.<div class="more-chips"><span>KakaoTalk</span><span>Notion</span><span>Discord</span><span>Telegram</span><span>Google Drive</span></div></div>`),
 ready:()=>`<section class="screen center"><div class="screen-copy"><span class="eyebrow">${icon('circle-check',12)} 준비 완료</span><h1>첫 질문을 해보세요</h1><p>인덱싱은 백그라운드에서 계속됩니다. 지금 읽힌 문서부터 바로 답을 받을 수 있습니다.</p></div><div class="ready-grid" style="margin-top:21px"><div class="ready-side"><div class="ready-card card"><h3>인덱싱 중</h3><div class="progress-line"><span id="readyProgress" style="width:${state.indexProgress}%"></span></div><div class="progress-copy"><span id="readyPhase">${state.indexProgress>=100?'완료':'문서 읽는 중'}</span><b id="readyPct">${state.indexProgress}%</b></div><div class="summary-chips"><span>${state.folders.filter(x=>x.selected).length}개 폴더</span><span>${state.embed==='local'?'이 Mac':'클라우드'} 임베딩</span></div></div><div class="ready-card card"><h3>알아두면 좋은 3가지</h3><div class="tip-list"><div class="tip"><b>1</b><span>상단 인덱싱 필에서 진행 상황을 확인합니다.</span></div><div class="tip"><b>2</b><span>파일이나 폴더를 AI Search에 드래그해 질문에 붙입니다.</span></div><div class="tip"><b>3</b><span>폴더·모델·소스는 Settings에서 언제든 변경합니다.</span></div></div></div></div><div class="ai-preview"><div class="ai-head">${icon('sparkles',14)}<b>AI Search</b><span style="margin-left:auto;color:var(--muted);font-size:9px">⌘K</span></div><div class="ai-body" id="aiBody">${state.answer?`<div class="answer"><div class="answer-user">${esc(state.answer.q)}</div><div class="answer-ai"><strong>찾아봤어요</strong>${esc(state.answer.a)}<div><span class="cite">Documents · report.pdf</span><span class="cite">Desktop · meeting.md</span></div></div></div>`:`<div class="ai-empty"><span class="tile-icon">${icon('sparkles',18)}</span><strong>무엇을 찾아드릴까요?</strong><p>선택한 폴더를 기준으로 질문을 시작해보세요.</p><div class="suggestions"><button data-act="ask" data-value="이번 달 계약서에서 갱신 조건을 찾아줘">계약서의 갱신 조건은?</button><button data-act="ask" data-value="최근 예산 파일을 요약해줘">최근 예산을 요약해줘</button><button data-act="ask" data-value="출시 일정 논의를 정리해줘">출시 일정 논의는?</button></div></div>`}</div><div class="ai-composer"><span>파일에 대해 질문하기…</span>${icon('corner-down-left',14)}</div></div></div></section>`
};
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function openOverlay(type){state.overlay=type;const o=document.getElementById('overlay');o.hidden=false;if(type==='fda')o.innerHTML=`<div class="modal"><div class="modal-head">${icon('settings',15)}<strong>전체 디스크 접근 권한</strong><button class="quiet" data-act="closeOverlay">${icon('x',15)}</button></div><div class="modal-body"><div class="guide"><div class="guide-copy"><h3>System Settings에서 켜기</h3><p>macOS 보호 영역을 읽으려면 한 번만 허용하면 됩니다. 앱을 종료해도 온보딩은 이 단계에서 이어집니다.</p><div class="guide-steps"><div class="guide-step"><b>1</b><span>Privacy & Security → Full Disk Access를 엽니다.</span></div><div class="guide-step"><b>2</b><span>AutoRAG를 목록에 추가하고 토글을 켭니다.</span></div><div class="guide-step"><b>3</b><span>macOS가 요청하면 종료 후 다시 엽니다.</span></div></div><div class="guide-app">${appIcon()}<span>목록에 없으면 이 아이콘을 목록으로 드래그</span></div></div><div class="settings-mock"><div class="settings-nav"><strong>Privacy & Security</strong><div>Notifications</div><div>Files & Folders</div><div class="active">Full Disk Access</div><div>Automation</div></div><div class="settings-pane"><h3>Full Disk Access</h3><p>아래 앱이 전체 디스크의 파일에 접근할 수 있습니다.</p><div class="system-row"><span class="system-app">⌘</span><strong>Terminal</strong><span class="system-toggle on"></span></div><div class="system-row"><span class="system-app">VS</span><strong>Visual Studio Code</strong><span class="system-toggle"></span></div><div class="system-row target"><span class="system-app">${icon('sparkles',13)}</span><strong>AutoRAG</strong><button class="system-toggle ${state.permissions.fda?'on pulse':''}" data-act="toggleFda"></button></div><div class="system-row"><span class="system-app">↗</span><strong>Backup</strong><span class="system-toggle"></span></div></div></div></div><div class="modal-actions"><button class="secondary" data-act="closeOverlay">나중에</button><button class="primary" data-act="simulateFda">허용했어요</button></div></div></div>`;else if(type==='restart')o.innerHTML=`<div class="modal system-alert"><div class="app-mini">${icon('sparkles',21)}</div><h3>AutoRAG를 다시 열까요?</h3><p>전체 디스크 접근 권한을 적용하려면 앱을 종료하고 다시 열어야 합니다. 온보딩은 현재 단계에서 이어집니다.</p><div class="modal-actions"><button class="secondary" data-act="closeOverlay">나중에</button><button class="primary" data-act="relaunch">종료 후 다시 열기</button></div></div>`;else if(type==='files')o.innerHTML=`<div class="modal system-alert"><div class="app-mini">${icon('folder',21)}</div><h3>“AutoRAG”이(가) Documents 폴더에 접근하려고 합니다.</h3><p>선택한 폴더 안의 파일만 인덱싱합니다. 파일을 변경하지 않습니다.</p><div class="modal-actions"><button class="secondary" data-act="denyFiles">허용 안 함</button><button class="primary" data-act="allowFiles">허용</button></div></div>`;else if(type==='why')o.innerHTML=`<div class="modal system-alert"><div class="app-mark" style="margin:0 auto 10px">${icon('shield-check',28)}</div><h3>전체 디스크 접근이 필요한 이유</h3><p>Mail 보관함, ~/Library, 일부 메신저 데이터와 외장 볼륨은 macOS가 기본적으로 보호합니다. 이 권한이 없으면 해당 소스만 빠지고, 선택한 일반 폴더 검색은 계속할 수 있습니다.</p><div class="modal-actions"><button class="primary" data-act="closeOverlay">알겠어요</button></div></div>`;}
function closeOverlay(){state.overlay=null;document.getElementById('overlay').hidden=true;document.getElementById('overlay').innerHTML='';}
function next(){if(!canNext())return;if(state.step===5&&!state.indexing){state.indexing=true;state.indexProgress=2;startIndexing();showToast('인덱싱을 시작했습니다. 다른 설정을 계속할 수 있어요.')}if(state.step<steps.length-1){state.step++;render();}}
function startIndexing(){if(startIndexing.timer)return;startIndexing.timer=setInterval(()=>{if(!state.indexing||state.indexPaused)return;if(state.indexProgress<100){state.indexProgress=Math.min(100,state.indexProgress+(state.embed==='cloud'?2.2:.8));renderChrome();const p=document.getElementById('readyProgress'),pct=document.getElementById('readyPct'),phase=document.getElementById('readyPhase');if(p)p.style.width=state.indexProgress+'%';if(pct)pct.textContent=Math.round(state.indexProgress)+'%';if(phase)phase.textContent=state.indexProgress<28?'문서 읽는 중':state.indexProgress<78?'임베딩 중':state.indexProgress<94?'데이터 소스 확인':'정리 중';}else{clearInterval(startIndexing.timer);startIndexing.timer=null;}},500)}
function ask(q){state.answer={q,a:'선택한 범위에서 관련 문서를 찾았습니다. 핵심 내용과 변경 이유를 간단히 정리하면, 최근 문서가 이전 버전보다 우선이며 원문 근거를 함께 확인할 수 있습니다.'};render();}
function syncNotes(){const n=document.getElementById('notes');n.classList.toggle('show',state.notes);n.innerHTML=`<strong>${steps[state.step][1]} · 기획 메모</strong><ul>${notes[steps[state.step][0]].map(x=>`<li>${x}</li>`).join('')}</ul>`}
function renderNotes(){syncNotes()}
function handle(action,value){switch(action){case'next':next();break;case'back':if(state.step>0){state.step--;render()}break;case'goto':state.step=Number(value);render();break;case'theme':state.theme=state.theme==='light'?'dark':'light';render();break;case'notes':state.notes=!state.notes;render();break;case'reset':state={...state,step:0,signedIn:false,authBusy:false,permissions:{fda:false,files:false,notifications:false,login:true},folders:structuredClone(folders),embed:'local',cloudConsent:false,modelVerified:false,key:'',indexing:false,indexProgress:0,answer:null,overlay:null};render();showToast('프로토타입을 처음 상태로 되돌렸습니다.');break;case'signin':state.authBusy=true;render();setTimeout(()=>{state.authBusy=false;state.signedIn=true;render();showToast('브라우저 인증이 완료되었습니다.')},900);break;case'magic':state.authBusy=true;render();setTimeout(()=>{state.authBusy=false;state.signedIn=true;render();showToast('매직 링크 인증이 완료되었습니다.')},1100);break;case'signout':state.signedIn=false;render();break;case'plan':state.plan=value;if(value!=='pro'&&state.embed==='cloud'){state.embed='local';state.cloudConsent=false;render();showToast('클라우드 임베딩은 Pro 전용입니다. 이 Mac 임베딩으로 바꾸고 다시 인덱싱합니다.');break;}render();break;case'fda':openOverlay('fda');break;case'toggleFda':openOverlay('restart');break;case'simulateFda':closeOverlay();openOverlay('restart');break;case'relaunch':state.permissions.fda=true;state.permissions.files=true;closeOverlay();showToast('권한이 적용되었습니다. 온보딩을 이어갑니다.');render();break;case'files':openOverlay('files');break;case'allowFiles':state.permissions.files=true;closeOverlay();showToast('Documents 접근을 허용했습니다.');render();break;case'denyFiles':closeOverlay();showToast('폴더 접근이 거부되었습니다. Settings에서 변경할 수 있습니다.');render();break;case'whyFda':openOverlay('why');break;case'closeOverlay':closeOverlay();break;case'notification':state.permissions.notifications=!state.permissions.notifications;render();break;case'login':state.permissions.login=!state.permissions.login;render();break;case'skipPermission':state.step++;render();showToast('제한된 권한으로 계속합니다.');break;case'allFolders':{const selected=!state.folders.every(x=>x.selected);state.folders.forEach(x=>x.selected=selected);render();break;}case'folder':{const f=state.folders.find(x=>x.id===value);if(f)f.selected=!f.selected;render();break}case'addFolder':if(state.folders.some(x=>x.id==='projects')){showToast('Projects가 이미 추가되어 있습니다.');break;}state.folders.push({id:'projects',name:'Projects',path:'~/Projects',files:640,size:'1.8 GB',time:9,selected:true,icon:'folder'});render();showToast('Projects를 추가했습니다.');break;case'embed':state.embed=value;state.cloudConsent=false;render();break;case'consent':state.cloudConsent=!state.cloudConsent;render();break;case'startIndex':next();break;case'switchByok':state.plan='byok';state.embed='local';render();break;case'useDetected':state.provider=value;state.modelVerified=true;render();showToast('예시 연결을 선택했습니다.');break;case'verify':if(state.key.trim().length<8&&state.provider!=='Ollama'){showToast('데모용 키를 8자 이상 입력해주세요.');break;}state.modelVerified=true;render();showToast('데모 연결 확인 완료 · 실제 API 호출 없음');break;case'provider':state.provider=value;state.modelVerified=false;render();break;case'source':{const s=state.sources.find(x=>x.id===value);if(s)s.on=!s.on;render();break}case'rewrite':{const s=state.sources.find(x=>x.id===value);if(s){s.desc=s.desc.replace('찾을 때 사용합니다.','필요한 맥락을 찾을 때 우선 참고합니다.');render();showToast('메타데이터 기반 설명을 다시 만들었습니다.')}break}case'ask':ask(value);break;case'finish':showToast('디자인 투어 완료 · 실제 앱 실행은 하지 않습니다.');break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.matches('input,select')&&!el.disabled)handle(el.dataset.act,el.dataset.value)});document.addEventListener('change',e=>{if(e.target.dataset.act)handle(e.target.dataset.act,e.target.dataset.value)});document.addEventListener('input',e=>{if(e.target.id==='keyInput')state.key=e.target.value;if(e.target.dataset.sourceInput){const s=state.sources.find(x=>x.id===e.target.dataset.sourceInput);if(s)s.desc=e.target.value;}});document.getElementById('themeBtn').addEventListener('click',()=>handle('theme'));document.getElementById('notesBtn').addEventListener('click',()=>handle('notes'));document.getElementById('resetBtn').addEventListener('click',()=>handle('reset'));document.getElementById('stepSelect').addEventListener('change',e=>handle('goto',e.target.value));document.getElementById('planSelect').addEventListener('change',e=>handle('plan',e.target.value));document.getElementById('indexPill').addEventListener('click',()=>document.getElementById('indexPopover').classList.toggle('hidden'));document.addEventListener('click',e=>{if(e.target.closest('#indexPill')){const p=document.getElementById('indexPopover');p.innerHTML=`<div class="pop-head"><span>인덱싱 진행</span><button class="quiet" data-act="pause">${state.indexPaused?icon('play',13):icon('pause',13)}</button></div>${[['문서 읽기',28],['임베딩',78],['데이터 소스',94],['정리 중',100]].map(([n,v])=>`<div class="phase ${state.indexProgress>=v?'done':''} ${state.indexProgress<v&&state.indexProgress>v-50?'active':''}"><span class="phase-dot"></span><span>${n}</span><small>${state.indexProgress>=v?'완료':v+'%'}</small></div>`).join('')}`}});document.addEventListener('click',e=>{if(e.target.closest('[data-act="pause"]')){state.indexPaused=!state.indexPaused;renderChrome()}});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.overlay){closeOverlay();return}if(e.key==='Enter'&&!['INPUT','TEXTAREA','BUTTON','SELECT'].includes(document.activeElement?.tagName)){if(state.step===steps.length-1)handle('finish');else if(canNext())next()}});
steps.forEach((s,i)=>{const o=document.createElement('option');o.value=i;o.textContent=`${i+1}. ${s[1]}`;document.getElementById('stepSelect').appendChild(o)});render();
</script>
</body>
</html>
