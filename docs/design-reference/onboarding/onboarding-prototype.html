.ix-tip{position:relative;display:grid;grid-template-columns:168px minmax(0,1fr);gap:18px;width:min(640px,100%);margin-top:30px;padding:16px 16px 18px;overflow:hidden;border:1px solid rgba(255,255,255,.08);border-radius:14px;background:linear-gradient(180deg,rgba(255,255,255,.055),rgba(255,255,255,.02));backdrop-filter:blur(10px)}.ix-tip-art{display:grid;place-items:center;height:118px;overflow:hidden;border:1px solid rgba(255,255,255,.06);border-radius:10px;background:radial-gradient(circle at 50% 25%,rgba(10,132,255,.2),transparent 70%),rgba(0,0,0,.35)}.ix-tip-art,.ix-tip-copy{animation:rise .3s ease-out}.ix-tip-head{display:flex;align-items:center;gap:7px;color:#64b5ff;font-size:10px;font-weight:700;letter-spacing:.08em}.ix-tip-head em{font-style:normal;color:rgba(255,255,255,.35);font-weight:500;letter-spacing:.02em}.ix-nav{display:flex;gap:4px;margin-left:auto}.ix-nav button{display:grid;place-items:center;width:24px;height:24px;padding:0;border:1px solid rgba(255,255,255,.12);border-radius:50%;background:transparent;color:rgba(255,255,255,.7)}.ix-nav button:hover{background:rgba(255,255,255,.08);color:#fff}.ix-nav button:last-child svg{transform:scaleX(-1)}.ix-tip h3{margin:8px 0 6px;color:#fff;font-size:15px;font-weight:600;letter-spacing:-.02em}.ix-tip p{margin:0;color:rgba(255,255,255,.58);font-size:12px;line-height:1.6}.ix-dots{display:flex;gap:5px;margin-top:12px}.ix-dots button{width:6px;height:6px;padding:0;border:0;border-radius:3px;background:rgba(255,255,255,.18);transition:width .2s,background .2s}.ix-dots button.on{width:18px;background:#fff}.ix-timer{position:absolute;left:0;right:0;bottom:0;height:2px;background:rgba(255,255,255,.04)}.ix-timer span{display:block;height:100%;transform:scaleX(0);transform-origin:left;background:#0a84ff;animation:tipfill 8s linear forwards}.ix.done .ix-timer span{background:#30d158}.ix-tip:hover .ix-timer span{animation-play-state:paused}@keyframes tipfill{to{transform:scaleX(1)}}
.keys{display:flex;align-items:center;gap:7px}.keycap{display:inline-grid;place-items:center;min-width:44px;height:44px;padding:0 12px;border:1px solid rgba(255,255,255,.12);border-bottom:3px solid #0d0d0f;border-radius:10px;background:linear-gradient(180deg,#3a3a3e,#232326);color:#fff;font-size:17px;font-weight:600;box-shadow:0 6px 14px rgba(0,0,0,.4)}.keycap.wide{min-width:118px;font-size:13px}.keys .keycap:last-child{animation:keypress 1.6s ease-in-out infinite}@keyframes keypress{0%,55%,100%{transform:none;border-bottom-width:3px}65%,80%{transform:translateY(2px);border-bottom-width:1px;background:linear-gradient(180deg,#2f6fd6,#1f4fa8)}}
.ix-mini{display:flex;flex-direction:column;gap:6px;width:136px;font-size:9px;color:rgba(255,255,255,.75)}.ix-mini .row{display:flex;align-items:center;gap:6px;padding:6px 7px;border:1px solid rgba(255,255,255,.08);border-radius:6px;background:rgba(255,255,255,.05)}.ix-mini .row.dim{opacity:.5}.ix-bubble{padding:8px;border-radius:8px;background:rgba(255,255,255,.07);line-height:1.5}.ix-cite{display:inline-flex;margin:4px 3px 0 0;padding:2px 5px;border-radius:4px;background:rgba(10,132,255,.25);color:#8cc8ff;font-size:8px}.ix-cite.hot{box-shadow:0 0 0 1px #0a84ff;animation:pulse 1.2s ease-in-out infinite}.ix-drag{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.5)}.ix-drag .tile{display:grid;place-items:center;width:30px;height:36px;border-radius:5px;background:#e5533d;color:#fff;font-size:8px;font-weight:800;animation:ixdrag 2.2s ease-in-out infinite}.ix-drag .pill{padding:7px 9px;border:1px dashed rgba(10,132,255,.6);border-radius:7px;background:rgba(10,132,255,.12);color:#8cc8ff;font-size:9px}@keyframes ixdrag{0%,20%{transform:none}60%,100%{transform:translateX(18px) rotate(6deg);opacity:.3}}.ix-brands{display:grid;grid-template-columns:repeat(3,32px);gap:8px}.ix-brands span{display:grid;place-items:center;width:32px;height:32px;border:1px solid rgba(255,255,255,.08);border-radius:9px;background:#1a1a1d;color:var(--lift,color-mix(in srgb,var(--brand) 60%,white))}

<body>
<div class="proto-bar">
  <div class="proto-brand"><span class="app-mini">✦</span><span>Onboarding prototype</span></div>
  <span class="demo-notice">디자인 데모 · 권한/인증/인덱싱은 시뮬레이션</span>
  <span class="proto-label">step</span><select id="stepSelect" aria-label="Jump to step"></select>
  <span class="proto-label">plan</span><select id="planSelect" aria-label="Plan scenario"><option value="free">Free</option><option value="air">Air</option><option value="pro">Pro</option><option value="byok">BYOK</option></select>
  <span class="proto-label">OS</span><select id="platformSelect" aria-label="Platform"><option value="macos">macOS</option><option value="windows">Windows</option></select>
  <span class="proto-label">speed</span><select id="speedSelect" aria-label="Indexing simulation speed"><option value="1">1× 실제</option><option value="60">60×</option><option value="120">120×</option><option value="600">600×</option></select>
  <span class="proto-spacer"></span><a class="proto-btn smart-link" href="./smart-indexing-prototype.html">✦ 스마트 인덱싱</a><button class="proto-btn icon" id="themeBtn" title="Toggle appearance"></button><button class="proto-btn" id="notesBtn">기획 메모</button><button class="proto-btn danger" id="resetBtn">처음부터</button>
</div>
<div class="app-wrap">
  <main class="app-window" id="appWindow"><header class="titlebar"><div class="traffic"><i></i><i></i><i></i></div><div class="window-title">Dazzi powered by AutoRAG</div></header>
    <div class="stage" id="stage"></div>
    <footer class="footer" id="footer"></footer>
    <div class="toast" id="toast"></div>
    <div class="scrim" id="overlay" hidden></div>
  </main>
</div>
<div class="notes" id="notes"></div>
<script>
const icon=(name,size=15,cls='')=>`<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${window.ICONS?.[name]||''}</svg>`;
const BRAND=window.BRAND;
const brandVars=(n)=>`--brand:${BRAND[n].color}${BRAND[n].lift?`;--lift:${BRAND[n].lift}`:''}`;
const brandMark=(n,size=16)=>`<svg class="brand-mark" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${BRAND[n].mark}</svg>`;
const sourceTile=(s)=>s.brand?`<span class="source-icon brand" style="${brandVars(s.brand)}">${brandMark(s.brand,17)}</span>`:`<span class="source-icon ${s.color}">${icon(s.icon,16)}</span>`;
const brandChip=(n,label)=>`<span class="brand-chip" style="${brandVars(n)}">${brandMark(n,12)}${label}</span>`;
const steps=[['welcome','소개'],['permissions','권한'],['account','계정'],['folders','폴더'],['embedding','임베딩'],['sources','데이터 소스'],['plan','플랜'],['model','AI 모델'],['indexing','인덱싱']];
const stepLabel=(id)=>steps.find(s=>s[0]===id)[1];
const STEP_LABELS={welcome:'시작하기',permissions:'계속',account:'계속',folders:'폴더로 계속',embedding:'계속',sources:'계속',model:'계속'};
/* 클라우드 임베딩을 고르면 플랜이 임베딩 바로 뒤로 온다. 로컬이면 데이터 소스 뒤에 온다.
   이미 플랜을 확정했거나 관리형 플랜이면 해당 단계는 목록에서 빠진다(모델 화면은 BYOK 전용). */
const flow=()=>{
	const mid=state.embed==='cloud'?['plan','sources']:['sources','plan'];
	const tail=state.plan==='byok'?['model','indexing']:['indexing'];
	return ['welcome','permissions','account','folders','embedding'].concat(state.planConfirmed?mid.filter(id=>id!=='plan'):mid).concat(tail);
};
const stepIndex=()=>Math.max(0,flow().indexOf(state.stepId));

면으로 돌아와 이어서 진행한다.','팁은 실제 단축키(keymap.ts)와 기능만 소개한다. 8초마다 넘어가고, 마우스를 올리면 멈추며, ←/→와 점으로 둘러볼 수 있다.','테마와 관계없이 어두운 몰입 화면으로 보여준다. 완료 순간에만 초록색 보상 연출과 열기 버튼이 켜진다.']};

 model:()=>split(`<span class="eyebrow">${icon('brain',12)} AI 모델</span><h1>${state.plan==='byok'?'사용할 모델을 연결하세요':'AI 모델은 준비됐어요'}</h1><p>${state.plan==='byok'?'감지된 연결을 사용하거나 provider와 API 키를 선택하세요.':'플랜에 맞는 답변 모델을 자동으로 구성합니다. 별도의 키 입력은 필요하지 않습니다.'}</p><div class="micro-note">${icon('lock',14)}<span>제품 구현 시 키는 Keychain에 보관합니다. 이 데모에는 실제 API 키를 입력하지 마세요.</span></div>`,state.plan!=='byok'?`<div class="model-box card"><header><div class="ok-circle">${icon('check',18)}</div><div><strong>AutoRAG 모델 준비 완료</strong><small>관리형 모델 · 자동 선택</small></div></header><div class="model-rows"><div class="model-row"><span>답변 모델</span><b>플랜 기본 모델</b></div><div class="model-row"><span>임베딩</span><b>${state.embed==='local'?'이 Mac':'클라우드'}</b></div></div><div class="action-row"><button class="quiet" data-act="switchByok">내 키로 연결하기 →</button></div></div>`:`<div><div class="detected"><div class="detected-title">감지 결과 예시</div><div class="detected-row"><span class="source-icon">${icon('key-round',14)}</span><div><strong>Anthropic API key</strong><small>환경변수 연결 예시</small></div><button class="secondary" data-act="useDetected" data-value="Anthropic">사용</button></div><div class="detected-row"><span class="source-icon">${icon('cpu',14)}</span><div><strong>Ollama</strong><small>로컬 runtime 예시</small></div><button class="secondary" data-act="useDetected" data-value="Ollama">사용</button></div></div><div class="card" style="padding:14px"><div class="provider-chips">${['Anthropic','OpenAI','OpenRouter','Google','Ollama','OpenAI 호환'].map(p=>`<button class="provider-chip ${state.provider===p?'selected':''}" data-act="provider" data-value="${p}">${p}</button>`).join('')}</div><div class="key-row"><input class="input" id="keyInput" type="password" placeholder="예시 키 입력 · 실제 키 사용 금지" value="${esc(state.key)}"><button class="secondary" data-act="verify">연결 확인</button></div><p style="font-size:10px;color:var(--muted)">${state.modelVerified?'✓ 데모 연결 완료 · 추천 모델 선택됨':'실제 네트워크 호출이나 키 저장은 하지 않습니다.'}</p><details><summary style="font-size:11px;color:var(--muted);cursor:pointer">고급 설정</summary><div class="model-row"><span>모델</span><b>provider 추천 모델</b></div><div class="model-row"><span>추론 레벨 (생성 모델만)</span><b>모델 기본값</b></div></details></div></div>`),
 sources:()=>split(`<span class="eyebrow">${icon('plug-zap',12)} 데이터 소스</span><h1>연결된 곳도<br>함께 찾을까요?</h1><p>이미 설치되고 인증된 소스만 먼저 보여드립니다. 모두 선택하지 않아도 됩니다.</p><div class="micro-note">${icon('info',14)}<span>설명을 직접 쓰지 않아도 됩니다. 켜면 메타데이터로 초안을 만들어 드립니다.</span></div>`, `<div class="source-list">${state.sources.map(s=>`<div class="source-row">${sourceTile(s)}<div class="source-main"><div class="source-name">${s.name} <span class="tag ${s.id==='mail'&&!state.permissions.fda?'req':''}">${s.id==='mail'&&!state.permissions.fda?'권한 필요':'감지됨'}</span></div><div class="source-detail">${s.detail}</div>${s.on?`<div class="source-description"><textarea data-source-input="${s.id}">${esc(s.desc)}</textarea><footer><span class="draft">✦ metadata 기반 초안 · 본문 미사용</span><button data-act="rewrite" data-value="${s.id}">${icon('wand-sparkles',11)} 다시 쓰기</button></footer></div>`:''}</div><button class="switch ${s.on?'on':''}" data-act="source" data-value="${s.id}" ${s.id==='mail'&&!state.permissions.fda?'disabled':''}></button></div>`).join('')}</div><div class="connect-more">준비가 필요한 소스는 나중에 Settings에서 연결할 수 있습니다.<div class="more-chips">${brandChip('kakaotalk','KakaoTalk')}${brandChip('notion','Notion')}${brandChip('discord','Discord')}${brandChip('telegram','Telegram')}${brandChip('googledrive','Google Drive')}</div></div>`),
 indexing:()=>{const done=state.indexProgress>=100;return `<section class="ix ${done?'done':''}">${ixLines()}${ixFloats()}<div class="ix-status" id="ixStatus" role="status">${ixStatus()}</div><h1 class="ix-title">${done?'모든 준비가 끝났어요':'AutoRAG가 파일을 읽고 있어요'}</h1><div class="ix-bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.floor(state.indexProgress)}"><span id="ixFill" style="width:${state.indexProgress}%"></span></div><div class="ix-meta" id="ixMeta">${ixMeta()}</div><div class="ix-phases" id="ixPhases">${ixPhases()}</div><div class="ix-gate">${ixGate()}</div>${tipCard()}</section>`}
};
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(showToast.t);showToast.t=setTimeout(()=>t.classList.remove('show'),2400)}
function openOverlay(type){state.overlay=type;const o=document.getElementById('overlay');o.hidden=false;if(type==='fda')o.innerHTML=`<div class="modal"><div class="modal-head">${icon('settings',15)}<strong>전체 디스크 접근 권한</strong><button class="quiet" data-act="closeOverlay">${icon('x',15)}</button></div><div class="modal-body"><div class="guide"><div class="guide-copy"><h3>System Settings에서 켜기</h3><p>macOS 보호 영역을 읽으려면 한 번만 허용하면 됩니다. 앱을 종료해도 온보딩은 이 단계에서 이어집니다.</p><div class="guide-steps"><div class="guide-step"><b>1</b><span>Privacy & Security → Full Disk Access를 엽니다.</span></div><div class="guide-step"><b>2</b><span>AutoRAG를 목록에 추가하고 토글을 켭니다.</span></div><div class="guide-step"><b>3</b><span>macOS가 요청하면 종료 후 다시 엽니다.</span></div></div><div class="guide-app">${appIcon()}<span>목록에 없으면 이 아이콘을 목록으로 드래그</span></div></div><div class="settings-mock"><div class="settings-nav"><strong>Privacy & Security</strong><div>Notifications</div><div>Files & Folders</div><div class="active">Full Disk Access</div><div>Automation</div></div><div class="settings-pane"><h3>Full Disk Access</h3><p>아래 앱이 전체 디스크의 파일에 접근할 수 있습니다.</p><div class="system-row"><span class="system-app">⌘</span><strong>Terminal</strong><span class="system-toggle on"></span></div><div class="system-row"><span class="system-app">VS</span><strong>Visual Studio Code</strong><span class="system-toggle"></span></div><div class="system-row target"><span class="system-app">${icon('sparkles',13)}</span><strong>AutoRAG</strong><button class="system-toggle ${state.permissions.fda?'on pulse':''}" data-act="toggleFda"></button></div><div class="system-row"><span class="system-app">↗</span><strong>Backup</strong><span class="system-toggle"></span></div></div></div></div><div class="modal-actions"><button class="secondary" data-act="closeOverlay">나중에</button><button class="primary" data-act="simulateFda">허용했어요</button></div></div></div>`;else if(type==='restart')o.innerHTML=`<div class="modal system-alert"><div class="app-mini">${icon('sparkles',21)}</div><h3>AutoRAG를 다시 열까요?</h3><p>전체 디스크 접근 권한을 적용하려면 앱을 종료하고 다시 열어야 합니다. 온보딩은 현재 단계에서 이어집니다.</p><div class="modal-actions"><button class="secondary" data-act="fdaLater">나중에</button><button class="primary" data-act="relaunch">종료 후 다시 열기</button></div></div>`;else if(type==='why')o.innerHTML=`<div class="modal system-alert"><div class="app-mark" style="margin:0 auto 10px">${icon('shield-check',28)}</div><h3>전체 디스크 접근이 필요한 이유</h3><p>Mail 보관함, 메시지 보관함, ~/Library와 외장 볼륨은 macOS가 기본적으로 보호합니다. 폴더별 권한을 따로 받지 않고 이 권한 하나로 통일했기 때문에, 온보딩에서는 이 항목만 요구합니다.</p><div class="modal-actions"><button class="primary" data-act="closeOverlay">알겠어요</button></div></div>`;else if(type==='notifications')o.innerHTML=`<div class="modal system-alert"><div class="app-mini">${icon('bell',21)}</div><h3>“AutoRAG”이(가) 알림을 보내고자 합니다.</h3><p>알림 권한만 받아 둡니다. 어떤 알림을 보낼지는 나중에 정합니다.</p><div class="modal-actions"><button class="secondary" data-act="closeOverlay">허용 안 함</button><button class="primary" data-act="allowNotifications">허용</button></div></div>`;else if(type==='winfw')o.innerHTML=`<div class="modal system-alert win"><div class="app-mini">${icon('shield',21)}</div><h3>Windows Defender 방화벽에서 이 앱의 일부 기능을 차단했습니다.</h3><p>클라우드 임베딩과 모델 호출에 네트워크 접근이 필요합니다. 사설망과 공용망 모두 허용해도 됩니다.</p><div class="modal-actions"><button class="secondary" data-act="closeOverlay">취소</button><button class="primary" data-act="allowFirewall">액세스 허용</button></div></div>`;else if(type==='win')o.innerHTML=`<div class="modal"><div class="modal-head">${icon('settings',15)}<strong>Windows 설정 · 알림</strong><button class="quiet" data-act="closeOverlay">${icon('x',15)}</button></div><div class="modal-body"><div class="settings-mock win"><div class="settings-nav"><strong>설정</strong><div>시스템</div><div class="active">알림</div><div>개인 정보 및 보안</div><div>방화벽 및 네트워크 보호</div></div><div class="settings-pane"><h3>알림</h3><p>앱별로 알림을 켜고 끌 수 있습니다.</p><div class="system-row"><span class="system-app">${icon('sparkles',13)}</span><strong>AutoRAG</strong><button class="system-toggle ${state.permissions.notifications?'on':''}" data-act="winToggle" data-value="notifications"></button></div><div class="system-row"><span class="system-app">⌘</span><strong>Terminal</strong><span class="system-toggle on"></span></div></div></div></div><div class="modal-actions"><button class="primary" data-act="closeOverlay">완료</button></div></div>`;else if(type==='pay'){const pro=state.plan==='pro';o.innerHTML=`<div class="modal" style="width:460px"><div class="modal-head">${icon('key-round',15)}<strong>${pro?'Pro 7일 무료 체험 시작':'Air 플랜 구독'}</strong><button class="quiet" data-act="closeOverlay">${icon('x',15)}</button></div><div class="modal-body"><p class="pay-lead">${pro?'7일 동안 무료입니다. 체험 기간에는 청구되지 않고, 끝나기 전에 알려드립니다. 클라우드 임베딩은 체험을 시작하면 바로 쓸 수 있습니다.':'오늘부터 매월 $4가 청구됩니다. 관리형 AI 모델을 Free보다 넉넉하게 쓸 수 있습니다.'}</p><div class="pay-summary"><span>오늘 결제</span><b>${pro?'$0':'$4'}</b></div><div class="pay-summary"><span>${pro?'7일 후부터':'다음 결제부터'}</span><small>매월 ${pro?'$20':'$4'}</small></div><div class="pay-grid"><label>카드 번호<input class="input" id="cardNumber" placeholder="4242 4242 4242 4242" inputmode="numeric"></label><label>만료<input class="input" id="cardExpiry" placeholder="MM / YY"></label><label>CVC<input class="input" id="cardCvc" placeholder="123" inputmode="numeric"></label></div><label class="consent"><input type="checkbox" data-act="payAgree" ${state.payAgree?'checked':''}><span>${pro?'7일 무료 체험이 끝나면 매월 $20 자동 결제에 동의합니다.':'매월 $4 자동 결제에 동의합니다.'} 언제든 Settings에서 해지할 수 있습니다.</span></label><p class="pay-demo">디자인 데모입니다. 실제 카드 정보를 입력하지 마세요. 결제도 발생하지 않습니다.</p><div class="modal-actions"><button class="secondary" data-act="closeOverlay">나중에</button><button class="primary" data-act="startTrial">${pro?'체험 시작':'$4 결제하고 계속'}</button></div></div></div>`}}
function closeOverlay(){state.overlay=null;document.getElementById('overlay').hidden=true;document.getElementById('overlay').innerHTML='';}
const nextId=()=>{const list=flow();const i=list.indexOf(state.stepId);return i<0||i>=list.length-1?null:list[i+1]};
function enterStep(id){state.stepId=id;if(id==='indexing')startIndexingIfReady();render()}
function advance(){const target=nextId();if(!target)return false;enterStep(target);return true}
function startIndexingIfReady(){if(state.indexing)return false;if(!(state.embed==='local'||state.paid==='pro'))return false;state.indexing=true;state.indexElapsed=0;state.indexProgress=0;startIndexing();return true}
function next(){if(!canNext())return;if(state.stepId==='plan'&&(state.plan==='air'||state.plan==='pro')&&state.paid!==state.plan){state.payAgree=false;openOverlay('pay');return}const target=nextId();if(state.stepId==='plan')state.planConfirmed=true;if(target)enterStep(target);}
function startIndexing(){if(startIndexing.timer)return;startIndexing.timer=setInterval(()=>{if(!state.indexing||state.indexProgress>=100)return;state.indexElapsed=Math.min(indexMinutes()*60,state.indexElapsed+.25*state.speed);state.indexProgress=Math.min(100,state.indexElapsed/(indexMinutes()*60)*100);if(state.stepId!=='indexing')return;if(state.indexProgress>=100)render();else updateIndexing()},250)}
function syncNotes(){const n=document.getElementById('notes');n.classList.toggle('show',state.notes);n.innerHTML=`<strong>${stepLabel(state.stepId)} · 기획 메모</strong><ul>${notes[state.stepId].map(x=>`<li>${x}</li>`).join('')}</ul>`}
function renderNotes(){syncNotes()}
function handle(action,value){switch(action){case'next':next();break;case'back':{const i=stepIndex();if(i>0){state.stepId=flow()[i-1];render()}break}case'goto':enterStep(value);break;case'theme':state.theme=state.theme==='light'?'dark':'light';render();break;case'notes':state.notes=!state.notes;render();break;case'reset':state={...state,stepId:'welcome',paid:null,payAgree:false,planConfirmed:false,signedIn:false,authBusy:false,permissions:{fda:false,fdaPending:false,notifications:false,firewall:false,login:true},folders:structuredClone(folders),embed:'local',cloudConsent:false,modelVerified:false,key:'',indexing:false,indexElapsed:0,indexProgress:0,tipIndex:0,overlay:null};closeOverlay();render();showToast('프로토타입을 처음 상태로 되돌렸습니다.');break;case'signin':state.authBusy=true;render();setTimeout(()=>{state.authBusy=false;state.signedIn=true;render();showToast('브라우저 인증이 완료되었습니다.');setTimeout(()=>{if(state.stepId==='account')advance()},700)},900);break;case'magic':state.authBusy=true;render();setTimeout(()=>{state.authBusy=false;state.signedIn=true;render();showToast('매직 링크 인증이 완료되었습니다.');setTimeout(()=>{if(state.stepId==='account')advance()},700)},1100);break;case'signout':state.signedIn=false;render();break;case'plan':state.plan=value;if(value!=='pro'&&state.embed==='cloud'){state.embed='local';state.cloudConsent=false;state.planConfirmed=true;state.stepId='sources';render();showToast('클라우드 임베딩은 Pro 전용입니다. 이 Mac 임베딩으로 바꾸고 데이터 소스를 이어서 설정합니다.');break;}render();break;case'fda':openOverlay('fda');break;case'toggleFda':openOverlay('restart');break;case'simulateFda':closeOverlay();openOverlay('restart');break;case'relaunch':state.permissions.fda=true;state.permissions.fdaPending=false;closeOverlay();showToast('권한이 적용되었습니다. 온보딩을 이어갑니다.');render();break;case'whyFda':openOverlay('why');break;case'closeOverlay':closeOverlay();break;case'payAgree':state.payAgree=!state.payAgree;break;case'startTrial':{const card=(document.getElementById('cardNumber')?.value||'').trim(),exp=(document.getElementById('cardExpiry')?.value||'').trim(),cvc=(document.getElementById('cardCvc')?.value||'').trim();if(!state.payAgree||!card||!exp||!cvc){showToast('카드 정보와 동의가 필요합니다. (데모)');break}state.paid=state.plan;closeOverlay();const target=nextId();showToast(state.plan==='pro'?'Pro 7일 무료 체험을 시작했습니다. (데모 · 실제 결제 없음)':'Air 플랜을 구독했습니다. (데모 · 실제 결제 없음)');if(target)enterStep(target);else render();break}case'platform':state.platform=value;render();break;case'fdaLater':state.permissions.fdaPending=true;closeOverlay();render();showToast('앱을 다시 열면 권한이 적용됩니다.');break;case'notifications':if(state.platform==='windows')openOverlay('win');else openOverlay('notifications');break;case'allowNotifications':state.permissions.notifications=true;closeOverlay();render();break;case'network':openOverlay('winfw');break;case'allowFirewall':state.permissions.firewall=true;closeOverlay();render();break;case'winToggle':if(value==='notifications')state.permissions.notifications=!state.permissions.notifications;if(value==='firewall')state.permissions.firewall=!state.permissions.firewall;openOverlay('win');break;case'login':state.permissions.login=!state.permissions.login;render();break;case'allFolders':{const selected=!state.folders.every(x=>x.selected);state.folders.forEach(x=>x.selected=selected);render();break;}case'folder':{const f=state.folders.find(x=>x.id===value);if(f)f.selected=!f.selected;render();break}case'addFolder':if(state.folders.some(x=>x.id==='projects')){showToast('Projects가 이미 추가되어 있습니다.');break;}state.folders.push({id:'projects',name:'Projects',path:'~/Projects',files:640,size:'1.8 GB',time:9,selected:true,icon:'folder'});render();showToast('Projects를 추가했습니다.');break;case'embed':state.embed=value;state.cloudConsent=false;render();break;case'consent':state.cloudConsent=!state.cloudConsent;render();break;case'startIndex':next();break;case'switchByok':state.plan='byok';state.embed='local';render();break;case'useDetected':state.provider=value;state.modelVerified=true;render();showToast('예시 연결을 선택했습니다.');break;case'verify':if(state.key.trim().length<8&&state.provider!=='Ollama'){showToast('데모용 키를 8자 이상 입력해주세요.');break;}state.modelVerified=true;render();showToast('데모 연결 확인 완료 · 실제 API 호출 없음');break;case'provider':state.provider=value;state.modelVerified=false;render();break;case'source':{const s=state.sources.find(x=>x.id===value);if(s)s.on=!s.on;render();break}case'rewrite':{const s=state.sources.find(x=>x.id===value);if(s){s.desc=s.desc.replace('찾을 때 사용합니다.','필요한 맥락을 찾을 때 우선 참고합니다.');render();showToast('메타데이터 기반 설명을 다시 만들었습니다.')}break}case'finish':if(state.indexProgress<100){showToast('인덱싱이 끝나야 AutoRAG를 열 수 있어요.');break}showToast('디자인 투어 완료 · 실제 앱 실행은 하지 않습니다.');break;case'tip':{const n=tips().length;state.tipIndex=(state.tipIndex+Number(value)+n)%n;updateTip();break}case'tipGo':state.tipIndex=Number(value);updateTip();break;case'speed':state.speed=Number(value);break;}}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(el&&!el.matches('input,select')&&!el.disabled)handle(el.dataset.act,el.dataset.value)});document.addEventListener('change',e=>{if(e.target.dataset.act)handle(e.target.dataset.act,e.target.dataset.value)});document.addEventListener('input',e=>{if(e.target.id==='keyInput')state.key=e.target.value;if(e.target.dataset.sourceInput){const s=state.sources.find(x=>x.id===e.target.dataset.sourceInput);if(s)s.desc=e.target.value;}});document.getElementById('themeBtn').addEventListener('click',()=>handle('theme'));document.getElementById('notesBtn').addEventListener('click',()=>handle('notes'));document.getElementById('resetBtn').addEventListener('click',()=>handle('reset'));document.getElementById('stepSelect').addEventListener('change',e=>handle('goto',e.target.value));document.getElementById('planSelect').addEventListener('change',e=>handle('plan',e.target.value));document.getElementById('platformSelect').addEventListener('change',e=>handle('platform',e.target.value));document.getElementById('speedSelect').addEventListener('change',e=>handle('speed',e.target.value));document.addEventListener('animationend',e=>{if(e.animationName==='tipfill'&&!matchMedia('(prefers-reduced-motion: reduce)').matches)handle('tip',1)});document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.overlay){closeOverlay();return}if(e.key==='Enter'&&!['INPUT','TEXTAREA','BUTTON','SELECT'].includes(document.activeElement?.tagName)){if(state.stepId==='indexing')handle('finish');else if(canNext())next()}if(state.stepId==='indexing'&&!state.overlay&&(e.key==='ArrowLeft'||e.key==='ArrowRight')&&!['INPUT','TEXTAREA','SELECT'].includes(document.activeElement?.tagName))handle('tip',e.key==='ArrowRight'?1:-1)});
let savedSmartScope=null;
function initializeSmartScope(){const frame=document.getElementById('smartScopeFrame');if(frame)frame.contentWindow.postMessage({type:'smart-scope-init',theme:state.theme,roots:savedSmartScope?.roots,exceptions:savedSmartScope?.exceptions},'*');}
window.addEventListener('message',event=>{const frame=document.getElementById('smartScopeFrame');if(!frame||event.source!==frame.contentWindow||event.data?.type!=='smart-scope-update')return;const data=event.data;savedSmartScope={roots:data.roots,exceptions:data.exceptions};state.folders=data.roots.map(root=>{const excluded=data.exceptions.filter(item=>item.selected&&item.parent===root.id);return {...root,files:root.files-excluded.reduce((n,item)=>n+item.files,0),size:(root.size-excluded.reduce((n,item)=>n+item.size,0)).toFixed(1)+' GB',time:Math.ceil(root.files/85)};});renderFooter();});
render();
</script>
