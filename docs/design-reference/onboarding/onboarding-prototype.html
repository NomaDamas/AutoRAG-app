<div class="proto"><span class="mark">✦</span><strong>Dazzi onboarding</strong><label>step</label><select id="step"></select><span class="spacer"></span><button class="icon" id="theme" title="테마 전환">◐</button><button id="memo">기획 메모</button><button class="danger" id="reset">처음부터</button></div>
<div class="wrap"><main class="window" id="window"><header class="titlebar"><div class="traffic"><i></i><i></i><i></i></div><div class="title">Dazzi powered by AutoRAG</div></header><div class="stage" id="stage"></div><footer class="footer" id="footer"></footer></main></div><div class="notes" id="notes"></div>
<script>
const steps=[['welcome','소개'],['permissions','권한'],['account','계정'],['smart','스마트 인덱싱'],['folders','폴더'],['embedding','임베딩'],['sources','데이터 소스'],['plan','플랜'],['model','AI 모델'],['indexing','인덱싱']];
const s={step:'welcome',theme:'light',signedIn:false,plan:'pro',smart:{phase:'idle',progress:0,route:'local',consent:false,include:{documents:true,desktop:true,icloud:true},exclude:{codex:true,obsidian:true,cache:true}},folders:{desktop:true,documents:true,icloud:true,downloads:false,pictures:false,drive:false},model:false,index:0,memo:false};
const notes={welcome:['현재 main의 실제 React 온보딩과 같은 가치 소개 화면.','스마트 인덱싱은 이 디자인 데모에서만 추가한 실험 단계.'],permissions:['macOS Full Disk Access는 필수 권한.','권한과 인덱싱 범위는 별개.'],account:['실제 main은 시스템 브라우저 OAuth. 데모 버튼은 성공 상태만 시뮬레이션.'],smart:['파일명·경로·확장자·일부 샘플 텍스트를 보고 추천한다고 가정.','큰 포함 경로를 우선 제안하고, 제외는 포함 경로 아래의 잡음 폴더만 노출.','숨김 폴더는 기본적으로 제외.'],folders:['스마트 추천을 적용하면 포함 경로와 중첩 제외 경로를 함께 보여줌.'],embedding:['현재 main은 로컬 임베딩만 활성화.'],sources:['감지된 connector만 노출.'],plan:['Free / Air / Pro / BYOK 구조.'],model:['BYOK에서만 모델 단계 노출.'],indexing:['마지막 설정 뒤 인덱싱 시작. 이 데모는 진행 화면을 시뮬레이션.']};
function icon(name){const map={sparkles:'✦',shield:'◇',folder:'▰',eye:'◉',brain:'◌',check:'✓',lock:'⌑',search:'⌕',cloud:'☁',laptop:'▱',plug:'⌁',user:'●',zap:'ϟ',loader:'◌',alert:'△',file:'▤'};return `<span aria-hidden="true">${map[name]||'•'}</span>`}
function flow(){return ['welcome','permissions','account','smart','folders','embedding','sources','plan',...(s.plan==='byok'?['model']:[]),'indexing']}
function label(id){return steps.find(x=>x[0]===id)?.[1]||id}
function nextOk(){if(s.step==='account')return s.signedIn||s.plan==='byok';if(s.step==='smart')return s.smart.phase==='review';if(s.step==='folders')return Object.values(s.folders).some(Boolean);if(s.step==='model')return s.model;return true}
function btns(){return `<button class="secondary" data-act="back">이전</button>`}
function welcome(){return `<section class="screen split"><div class="copy"><span class="eyebrow">${icon('sparkles')} Pro 7일 무료 체험</span><h1>파일에게<br>물어보세요</h1><p>폴더를 열어 뒤지지 않아도 됩니다. Dazzi가 문서 안의 내용을 읽고, 근거와 함께 답합니다.</p><div class="note">${icon('shield')}<span>기본값은 로컬 처리입니다. 원격 처리가 필요한 순간에는 무엇이 전송되는지 먼저 보여드립니다.</span></div></div><div class="feature-grid"><article class="feature card"><div class="art"><div class="bubble user">지난 분기 비용이 왜 줄었어?</div><div class="bubble">마케팅 비용은 전분기보다 <b>18%</b> 줄었습니다.<br><span class="chip">budget.xlsx · 4</span><span class="chip">회의록.md · 2</span></div></div><div class="feature-label">${icon('sparkles')}<span>AI 검색<small>답변과 근거를 한 번에</small></span></div></article><article class="feature card"><div class="art"><div class="minirow">PDF · 01 · 매출 보고서</div><div class="minirow">XLS · 02 · Budget summary</div></div><div class="feature-label">${icon('file')}<span>근거 인용<small>답변의 출처를 확인</small></span></div></article><article class="feature card"><div class="art"><div class="minirow"><span class="tag green">최신본</span> proposal-final.docx</div><div class="minirow"><span class="tag">유사본</span> proposal-v3.docx</div><div class="minirow"><span class="tag orange">동일본</span> proposal-copy.docx</div></div><div class="feature-label">${icon('folder')}<span>버전 묶기<small>중복 문서를 정리</small></span></div></article><article class="feature card"><div class="art"><div class="minirow">문서 미리보기 · Quick Look</div></div><div class="feature-label">${icon('eye')}<span>Quick Look<small>열기 전 미리보기</small></span></div></article><article class="feature card"><div class="art"><div class="minirow">Slack · GitHub · Obsidian</div></div><div class="feature-label">${icon('plug')}<span>데이터 소스<small>연결된 곳까지 함께 검색</small></span></div></article><article class="feature card"><div class="art"><span class="tag">키워드</span> <span class="tag">의미</span> <span class="tag">리랭킹</span><div class="minirow">1 · 회의록.md · ↑ 3→1</div><div class="minirow">2 · report-q3.pdf</div></div><div class="feature-label">${icon('search')}<span>하이브리드 검색<small>키워드와 의미를 함께 정렬</small></span></div></article></div></section>`}

function smart(){if(s.smart.phase==='idle')return `<section class="screen center"><div class="copy"><span class="eyebrow experimental">${icon('sparkles')} 실험 · 스마트 인덱싱</span><h1>AI가 먼저<br>인덱싱 범위를 정리해요</h1><p>전체 폴더를 고르기 전에 파일 이름, 확장자, 폴더 구조와 일부 텍스트 샘플을 살펴보고 검색에 유용한 큰 폴더와 시간이 낭비될 폴더를 추천합니다.</p></div><div class="smart"><div class="smartintro"><span class="smart-icon">${icon('brain')}</span><div><h3>Jev 기반 범위 추천 · 디자인 프로토타입</h3><p>파일 본문 전체를 인덱싱하지 않습니다. 추천에 필요한 최소 샘플만 보고, 실제 인덱싱 전에 포함·제외 경로를 확정합니다.</p></div></div><div class="scan card"><div class="scanhead"><span class="smart-icon">${icon('search')}</span><div><b>홈 폴더의 큰 위치를 먼저 확인</b><small>Documents · Desktop · Downloads · iCloud Drive</small></div></div><div class="progress"><span style="width:0"></span></div><div class="scanstatus">아직 파일을 읽지 않았어요.</div><div class="actions"><button class="secondary" data-act="skip-smart">직접 고르기</button><button class="primary" data-act="scan-smart">${icon('sparkles')} 스마트 추천 시작</button></div></div><div class="smartfoot">${icon('lock')}<span>로컬 파일의 이름·경로·확장자·일부 샘플만 사용한다는 전제의 데모입니다. 실제 LLM 호출은 연결하지 않았습니다.</span></div></div></section>`;if(s.smart.phase==='scanning')return `<section class="screen center"><div class="copy"><span class="eyebrow experimental">${icon('loader')} 분석 중</span><h1>파일 구조를<br>살펴보는 중이에요</h1><p>세션 기록, 캐시, 빌드 산출물처럼 검색에 도움이 적은 하위 폴더를 찾고 있습니다.</p></div><div class="smart"><div class="scan card"><div class="scanhead"><span class="smart-icon">${icon('brain')}</span><div><b>LLM이 구조와 샘플을 요약하는 중</b><small>${s.smart.progress<40?'Documents와 Desktop을 확인하고 있어요':s.smart.progress<75?'Codex·.obsidian·캐시 폴더를 비교하고 있어요':'검색 가치와 예상 비용을 비교하고 있어요'}</small></div></div><div class="progress"><span style="width:${s.smart.progress}%"></span></div><div class="scanstatus">${s.smart.progress}% · 추천을 만들기 전에는 인덱싱하지 않습니다.</div></div></div></section>`;return `<section class="screen center"><div class="copy"><span class="eyebrow experimental">${icon('sparkles')} 추천 결과</span><h1>이 범위로 시작하면<br>불필요한 대기를 줄일 수 있어요</h1><p>큰 폴더는 유지하고, 그 아래에서 세션·설정·캐시처럼 검색 품질에 도움이 적은 경로만 제외했습니다.</p></div><div class="smart"><div class="recommend"><div class="column card"><h4>포함할 큰 폴더 <span>3개 추천</span></h4>${path('Documents','~/Documents','업무 문서와 개인 자료 · 검색 가치 높음','include','documents',s.smart.include.documents)}${path('Desktop','~/Desktop','최근 작업 파일 · 검색 가치 높음','include','desktop',s.smart.include.desktop)}${path('iCloud Drive','~/Library/Mobile Documents','온라인 전용 파일은 자동 대기','include','icloud',s.smart.include.icloud)}</div><div class="column card"><h4>제외할 하위 폴더 <span>숨김 폴더 기본 제외</span></h4>${path('Codex','~/Documents/Codex','세션 기록 18,420개 · 반복 텍스트가 많음','exclude','codex',s.smart.exclude.codex)}${path('.obsidian','~/Documents/.obsidian','숨김 설정 폴더 · 기본 제외','exclude','obsidian',s.smart.exclude.obsidian)}${path('.cache / build','~/Desktop/.cache · ~/Desktop/build','캐시·빌드 산출물 · 기본 제외','exclude','cache',s.smart.exclude.cache)}</div></div><div class="evidence"><span>샘플: session-*.json</span><span>패턴: 반복 로그 18.4k</span><span>예상 절감: 약 61%</span><span>숨김 폴더: 기본 제외</span></div><div class="smartfoot">${icon('alert')}<span>추천은 확정이 아닙니다. 다음 폴더 화면에서 큰 포함 경로를 직접 확인하고 세부 제외 경로를 수정할 수 있습니다.</span></div><div class="actions"><button class="secondary" data-act="skip-smart">추천 없이 직접 선택</button><button class="primary" data-act="apply-smart">추천을 반영하고 폴더 선택으로</button></div></div></section>`}
function folders(){const rows=[['desktop','Desktop','~/Desktop'],['documents','Documents','~/Documents'],['icloud','iCloud Drive','~/Library/Mobile Documents'],['downloads','Downloads','~/Downloads'],['pictures','Pictures','~/Pictures'],['drive','Google Drive','~/Google Drive']];return `<section class="screen center"><div class="copy"><span class="eyebrow">${icon('folder')} 인덱싱 범위</span><h1>AI가 읽을 폴더를 고르세요</h1><p>여기 선택한 큰 폴더만 AI 검색에 포함됩니다. 스마트 추천의 하위 제외 경로는 인덱싱 전에 함께 적용됩니다.</p></div><div class="foldergrid">${rows.map(([id,name,path])=>`<div class="folder ${s.folders[id]?'selected':''}" data-act="folder" data-key="${id}"><div class="foldertop"><span class="check">✓</span><div><div class="foldername">${name}</div><div class="path">${path}</div><div class="stats">${id==='documents'?'3,186개 · 6.4 GB · 약 38분':id==='desktop'?'412개 · 0.8 GB · 약 5분':id==='icloud'?'1,954개 · 2.9 GB · 약 22분':'선택 시 사전 스캔'}</div></div></div></div>`).join('')}</div><div class="summary"><b>${Object.values(s.folders).filter(Boolean).length}개 폴더 · 5,552개 파일 · 10.1 GB</b><small>${s.smart.phase==='review'?'스마트 제외: ~/Documents/Codex · ~/Documents/.obsidian · ~/Desktop/.cache/build':'node_modules · .git · 숨김 폴더 · 50 MiB 초과 파일은 자동으로 제외합니다.'}</small></div></section>`}
function embedding(){return `<section class="screen split"><div class="copy"><span class="eyebrow experimental">${icon('lock')} 중요한 선택</span><h1>어디서<br>임베딩할까요?</h1><p>문서를 검색할 수 있게 벡터로 바꾸는 작업을 어디서 할지 정합니다. 나중에 바꾸면 처음부터 다시 해야 합니다.</p><div class="note">${icon('alert')}<span>임베딩 모델이나 처리 위치를 바꾸면 지금 만든 인덱스를 버리고 다시 만들어야 합니다.</span></div></div><div class="embedgrid"><div class="embed card selected"><span class="smart-icon">${icon('laptop')}</span><h3>이 Mac에서</h3><p>파일 본문이 Mac 밖으로 나가지 않습니다.</p><div class="metrics"><div class="metric">예상 시간<b>약 65분</b></div><div class="metric">다운로드<b>준비됨</b></div><div class="metric">프라이버시<b>로컬</b></div></div></div><div class="embed card disabled"><span class="tag">준비 중</span><span class="smart-icon">${icon('cloud')}</span><h3>클라우드에서</h3><p>현재 제품에서는 사용할 수 없습니다.</p><div class="metrics"><div class="metric">상태<b>비활성화</b></div><div class="metric">저장<b>없음</b></div><div class="metric">플랜<b>Pro 전용</b></div></div></div></div></section>`}
function sources(){return `<section class="screen split"><div class="copy"><span class="eyebrow">${icon('plug')} 데이터 소스</span><h1>연결된 곳도<br>함께 찾을까요?</h1><p>이미 설치되고 인증된 소스만 먼저 보여드립니다. 모두 선택하지 않아도 됩니다.</p></div><div><div class="sources"><div class="row"><span class="icon">GH</span><div class="main"><b>GitHub <span class="tag">감지됨</span></b><div class="desc">로그인됨 · Issues와 Pull Requests</div></div><button class="switch">●</button></div><div class="row"><span class="icon">Ob</span><div class="main"><b>Obsidian <span class="tag">감지됨</span></b><div class="desc">Vault 2개 발견</div></div><button class="switch">●</button></div></div><div class="more">준비가 필요한 소스는 나중에 Settings에서 연결할 수 있습니다.<br><span>KakaoTalk</span><span>Slack</span><span>Notion</span><span>Google Drive</span></div></div></section>`}
function plan(){return `<section class="screen center"><div class="copy"><span class="eyebrow">${icon('zap')} 플랜</span><h1>어떻게 사용할까요?</h1><p>플랜에 따라 AI 사용량과 답변 모델 경로가 정해집니다. 임베딩은 이 Mac에서 처리합니다.</p></div><div class="planlist">${[['free','Free','무료'],['air','Air','$4'],['pro','Pro','$20'],['byok','BYOK','API 비용만']].map(([id,n,p])=>`<div class="plan ${s.plan===id?'selected':''}" data-act="plan" data-value="${id}"><b>${n}</b><b>${p}</b><small>${id==='pro'?'가장 빠른 첫 인덱싱':id==='byok'?'내 키로 직접 연결':'가볍게 시작하기'}<br>Finder와 검색 기능 모두 사용</small></div>`).join('')}</div></section>`}
function model(){return `<section class="screen split"><div class="copy"><span class="eyebrow">${icon('brain')} AI 모델</span><h1>사용할 모델을<br>연결하세요</h1><p>감지된 연결을 사용하거나 provider와 API 키를 선택하세요.</p><div class="note">${icon('lock')}<span>키는 암호화되어 저장되며 설정 파일에는 기록되지 않습니다.</span></div></div><div class="card" style="padding:14px"><div class="row"><span class="icon">${icon('laptop')}</span><div class="main"><b>Ollama</b><div class="desc">로컬 runtime</div></div><button class="secondary" data-act="verify">사용</button></div><div style="display:flex;gap:7px;margin-top:10px"><input placeholder="API 키 입력" style="flex:1;height:34px;border:1px solid var(--border);border-radius:7px;background:var(--card);padding:0 10px"><button class="secondary" data-act="verify">연결 확인</button></div><p style="color:var(--muted);font-size:10px">${s.model?'✓ 연결 완료 · 추천 모델이 선택되었습니다.':'키를 확인해야 다음 단계로 갈 수 있습니다.'}</p></div></section>`}
function indexing(){const done=s.index>=100;return `<section class="ix"><div class="ixstatus">${icon(done?'check':'loader')}<span>${done?'인덱싱 완료':'인덱싱 중…'}<small>${done?'5,552개 파일 · 스마트 제외 경로 적용됨':'Documents · 회의록 0912.md'}</small></span></div><h1 class="ixtitle">${done?'모든 준비가 끝났어요':'Dazzi가 파일을 읽고 있어요'}</h1><div class="ixbar"><span style="width:${s.index}%"></span></div><div class="ixmeta"><b>${s.index}%</b><span>·</span><span>${done?'완료':'약 65분 남음'}</span><span>·</span><span>스마트 제외 적용</span></div><div class="ixphases">● 문서 읽기　○ 임베딩　○ 정리</div><div class="ixgate"><div class="ixnotice"><strong>${done?'이제 종료해도 괜찮아요':'Dazzi를 종료하지 마세요'}</strong><small>${done?'새로 바뀐 파일은 백그라운드에서 이어서 읽습니다.':'첫 인덱싱은 오래 걸립니다. 전원 어댑터를 연결해 두세요.'}</small></div><button class="ixopen" disabled>${done?'Dazzi 열기':'완료되면 열 수 있어요'}</button></div><div class="tip"><h3>⌘K 한 번이면 바로 질문</h3><p>어느 화면에서든 AI Search 입력창으로 이동합니다. 폴더를 열지 않고 문서 내용을 묻고 근거와 함께 답을 받으세요.</p></div></section>`}
function render(){const list=flow();if(!list.includes(s.step))s.step=list[0];document.documentElement.dataset.appearance=s.theme;document.getElementById('window').classList.toggle('immersive',s.step==='indexing');const views={welcome,permissions,account,smart,folders,embedding,sources,plan,model,indexing};document.getElementById('stage').innerHTML=views[s.step]();document.getElementById('step').innerHTML=list.map((id,i)=>`<option value="${id}">${i+1}. ${label(id)}</option>`).join('');document.getElementById('step').value=s.step;const i=list.indexOf(s.step);document.getElementById('footer').innerHTML=s.step==='indexing'?'':`<button class="back" data-act="back" ${i===0?'disabled':''}>‹</button><div class="dashes">${list.map((_,j)=>`<span class="dash ${j<i?'done ':''}${j===i?'active':''}"></span>`).join('')}</div><button class="primary" data-act="next" ${nextOk()?'':'disabled'}>${s.step==='smart'?'추천 적용':s.step==='folders'?'폴더로 계속':'계속'}　↵</button>`;const n=document.getElementById('notes');n.classList.toggle('show',s.memo);n.innerHTML=`<b>${label(s.step)} · 기획 메모</b><ul>${(notes[s.step]||[]).map(x=>`<li>${x}</li>`).join('')}</ul>`}
function advance(){if(!nextOk())return;const list=flow(),i=list.indexOf(s.step);if(s.step==='smart')s.smart.phase='review';const target=list[i+1];if(target){s.step=target;render();if(target==='indexing')simulateIndex()}}
function scan(){if(s.smart.phase!=='idle')return;s.smart.phase='scanning';s.smart.progress=0;render();clearInterval(scan.timer);scan.timer=setInterval(()=>{s.smart.progress=Math.min(100,s.smart.progress+10);if(s.smart.progress>=100){clearInterval(scan.timer);s.smart.phase='review'}render()},180)}
function simulateIndex(){clearInterval(simulateIndex.timer);simulateIndex.timer=setInterval(()=>{s.index=Math.min(100,s.index+5);render();if(s.index>=100)clearInterval(simulateIndex.timer)},220)}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const a=el.dataset.act;if(a==='next')return advance();if(a==='back'){const l=flow(),i=l.indexOf(s.step);if(i>0)s.step=l[i-1];return render()}if(a==='signin'){s.signedIn=true;return render()}if(a==='signout'){s.signedIn=false;return render()}if(a==='byok'){s.plan='byok';s.signedIn=true;s.step='smart';return render()}if(a==='scan-smart')return scan();if(a==='skip-smart'){s.smart.phase='skipped';s.step='folders';return render()}if(a==='apply-smart'){s.smart.phase='review';s.step='folders';return render()}if(a==='verify'){s.model=true;return render()}if(a==='plan'){s.plan=el.dataset.value;return render()}if(a==='folder'){const k=el.dataset.key;s.folders[k]=!s.folders[k];return render()}if(a==='toggle-include'){s.smart.include[el.dataset.key]=!s.smart.include[el.dataset.key];return render()}if(a==='toggle-exclude'){s.smart.exclude[el.dataset.key]=!s.smart.exclude[el.dataset.key];return render()}});document.getElementById('step').addEventListener('change',e=>{s.step=e.target.value;render()});document.getElementById('theme').addEventListener('click',()=>{s.theme=s.theme==='light'?'dark':'light';render()});document.getElementById('memo').addEventListener('click',()=>{s.memo=!s.memo;render()});document.getElementById('reset').addEventListener('click',()=>{location.reload()});render();
</script>
</body>
</html>
