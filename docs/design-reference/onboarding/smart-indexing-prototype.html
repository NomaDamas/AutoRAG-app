<style>

*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:var(--sans);color:var(--ink);background:var(--desk);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--blue);outline-offset:2px}.toolbar{position:sticky;top:14px;z-index:10;width:min(1120px,calc(100% - 32px));margin:14px auto 10px;display:flex;align-items:center;gap:9px;padding:7px 9px;border:1px solid var(--border);border-radius:10px;background:color-mix(in srgb,var(--window) 88%,transparent);backdrop-filter:blur(18px);box-shadow:0 10px 30px rgba(20,20,40,.14);font-size:11px;color:var(--muted)}.brand{display:flex;align-items:center;gap:8px;color:var(--ink);font-weight:600}.sun{display:grid;place-items:center;width:25px;height:25px;border-radius:7px;background:linear-gradient(145deg,#f9c450,#ec7e34);color:white;font-size:15px;box-shadow:0 3px 8px rgba(220,120,45,.28)}.toolbar .spacer{flex:1}.toolbar label{display:flex;align-items:center;gap:5px;color:var(--faint);font-size:9px;text-transform:uppercase;letter-spacing:.07em}.toolbar select,.toolbar button{height:28px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--body);padding:0 9px;font-size:11px}.toolbar button.icon{width:29px;padding:0}.shell{width:min(1120px,calc(100% - 32px));margin:0 auto 30px}.window{display:grid;grid-template-rows:42px minmax(0,1fr) 62px;height:720px;overflow:hidden;border:1px solid var(--border);border-radius:13px;background:var(--window);box-shadow:var(--shadow)}.titlebar{display:flex;align-items:center;padding:0 15px;border-bottom:1px solid var(--divider);background:var(--chrome)}.traffic{display:flex;gap:7px}.traffic i{width:12px;height:12px;border-radius:50%}.traffic i:nth-child(1){background:#ff5f57}.traffic i:nth-child(2){background:#febc2e}.traffic i:nth-child(3){background:#28c840}.title{text-align:center;flex:1;margin-left:74px;color:var(--muted);font-size:12px}.stage{min-height:0;overflow:auto;background:var(--stage)}.screen{min-height:100%;padding:28px 42px 22px}.hero{display:flex;align-items:flex-start;justify-content:space-between;gap:24px;margin-bottom:18px}.hero-copy{min-width:0}.eyebrow{display:inline-flex;align-items:center;gap:6px;padding:5px 9px;border:1px solid color-mix(in srgb,var(--blue) 20%,var(--border));border-radius:13px;background:var(--blue-soft);color:var(--blue);font-size:10px;font-weight:600}.eyebrow b{padding:2px 5px;border-radius:4px;background:var(--blue);color:white;font-size:8px}.hero h1{margin:11px 0 8px;font-size:28px;line-height:1.18;letter-spacing:-.045em}.hero p{margin:0;max-width:650px;color:var(--muted);font-size:12px;line-height:1.65}.status{display:flex;align-items:center;gap:7px;margin-top:6px;color:var(--blue);font-size:10px;white-space:nowrap}.status i{width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 3px var(--green-bg)}.board{display:grid;grid-template-columns:1.08fr .92fr;gap:12px}.pane{overflow:hidden;border:1px solid var(--border);border-radius:11px;background:var(--card);box-shadow:0 2px 8px rgba(20,20,40,.025)}.pane-head{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;border-bottom:1px solid var(--divider);background:linear-gradient(var(--card),var(--stage))}.pane-head h2{display:flex;align-items:center;gap:7px;margin:0;font-size:12px}.pane-head h2 span{color:var(--blue)}.pane-head small{color:var(--muted);font-size:9px}.root{position:relative;display:flex;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--divider);cursor:pointer;transition:background .15s}.root:hover{background:var(--blue-soft)}.root input,.exception input{position:absolute;opacity:0}.root .check,.exception .check{display:grid;place-items:center;flex:none;width:17px;height:17px;border:1.5px solid var(--border);border-radius:5px;color:transparent}.root.selected{background:linear-gradient(90deg,var(--blue-soft),transparent 85%)}.root.selected .check{border-color:var(--blue);background:var(--blue);color:#fff}.folder-icon{position:relative;display:grid;place-items:center;width:31px;height:26px;border-radius:4px;background:linear-gradient(#8cb9f7 0 28%,#70a8f5 28%);color:#4c89dc}.root-copy{min-width:0;flex:1}.root-copy strong{display:block;font-size:11.5px}.root-copy small{display:block;margin-top:3px;color:var(--muted);font-size:9px;line-height:1.4}.root-meta{text-align:right;color:var(--muted);font-size:9px;white-space:nowrap}.root-meta b{display:block;color:var(--ink);font-size:11px;font-weight:500}.root-meta span{display:block;margin-top:3px;color:var(--blue)}details.more>summary{padding:11px 15px;color:var(--muted);font-size:9.5px;cursor:pointer;background:var(--stage)}.add{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;height:37px;border:0;background:var(--card);color:var(--blue);font-size:10px}.add:hover{background:var(--blue-soft)}.exceptions{padding:0 15px}.exception{display:flex;align-items:flex-start;gap:9px;position:relative;padding:14px 0;border-bottom:1px solid var(--divider);cursor:pointer}.exception:last-child{border-bottom:0}.exception.selected .check{border-color:#b67924;background:var(--orange-bg);color:#a56a17}.exception-copy{min-width:0;flex:1}.exception-copy strong{display:flex;align-items:center;gap:6px;font-size:11px;overflow-wrap:anywhere}.exception-copy small{display:block;margin-top:4px;color:var(--muted);font-size:9px;line-height:1.45}.exception-copy code{display:block;margin-top:5px;color:var(--faint);font:9px ui-monospace,SFMono-Regular,monospace;overflow-wrap:anywhere}.pill{display:inline-flex;align-items:center;padding:3px 5px;border-radius:4px;background:var(--orange-bg);color:#a56a17;font-size:8px;font-weight:600}.exception-impact{display:inline-flex;margin-top:7px;padding:3px 6px;border-radius:4px;background:var(--orange-bg);color:#a56a17;font-size:8.5px}.hidden-note{display:flex;gap:7px;padding:10px 15px;border-top:1px solid var(--divider);background:var(--stage);color:var(--muted);font-size:9px;line-height:1.45}.hidden-note span{color:var(--blue)}.summary{display:flex;align-items:center;gap:20px;margin-top:13px;padding:13px 15px;border:1px solid color-mix(in srgb,var(--blue) 22%,var(--border));border-radius:10px;background:linear-gradient(100deg,var(--blue-soft),var(--card) 78%)}.summary-main{flex:1}.summary-main strong{display:block;font-size:11.5px;font-variant-numeric:tabular-nums}.summary-main small{display:block;margin-top:4px;color:var(--muted);font-size:9.5px}.time{display:flex;align-items:baseline;gap:8px;white-space:nowrap}.time del{color:var(--muted);font-size:11px}.time b{color:var(--blue);font-size:20px;letter-spacing:-.035em}.saving{padding:4px 6px;border-radius:5px;background:var(--green-bg);color:#208842;font-size:9px}.bottom{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:8px;color:var(--muted);font-size:9px}.bottom .actions{display:flex;gap:7px}.primary,.secondary,.quiet{height:34px;padding:0 14px;border-radius:7px;font-size:11px}.primary{border:1px solid var(--blue);background:var(--blue);color:#fff;box-shadow:0 2px 5px rgba(10,100,216,.2)}.primary:hover{background:#007aff}.primary:disabled{opacity:.45;cursor:not-allowed}.secondary{border:1px solid var(--border);background:var(--card);color:var(--body)}.quiet{border:0;background:transparent;color:var(--muted);padding:0 4px}.quiet:hover{color:var(--blue)}.kbd{display:inline-grid;place-items:center;min-width:18px;height:17px;padding:0 4px;margin-left:4px;border:1px solid currentColor;border-radius:4px;font-size:9px;opacity:.7}.footer{display:flex;align-items:center;gap:16px;padding:0 17px;border-top:1px solid var(--divider);background:var(--window)}.back{display:grid;place-items:center;width:30px;height:30px;border:1px solid var(--border);border-radius:50%;background:var(--card);color:var(--body)}.progress{display:flex;justify-content:center;gap:5px;flex:1}.dot{width:18px;height:3px;border-radius:3px;background:var(--border)}.dot.active{width:34px;background:var(--blue)}.modal-scrim{position:absolute;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(20,20,25,.22);backdrop-filter:blur(3px)}.modal{width:420px;padding:22px;border:1px solid var(--border);border-radius:12px;background:var(--card);box-shadow:var(--shadow)}.modal h2{margin:0 0 8px;font-size:17px}.modal p{margin:0;color:var(--muted);font-size:10px;line-height:1.6}.modal label{display:block;margin-top:15px;color:var(--muted);font-size:10px}.modal input{display:block;width:100%;height:35px;margin-top:6px;padding:0 10px;border:1px solid var(--border);border-radius:7px;background:var(--card);color:var(--ink)}.modal .error{color:var(--red);font-size:10px}.modal-actions{display:flex;justify-content:flex-end;gap:7px;margin-top:17px}.scan-screen{display:grid;grid-template-columns:310px minmax(0,1fr);gap:45px;align-items:center}.scan-card{display:flex;flex-direction:column;align-items:center;text-align:center;padding:28px;border:1px solid var(--border);border-radius:14px;background:linear-gradient(135deg,var(--blue-soft),var(--card));box-shadow:0 5px 18px rgba(20,20,40,.07)}.orbit{position:relative;display:grid;place-items:center;width:145px;height:145px;margin-bottom:24px;border:1px solid var(--divider);border-radius:50%;background:radial-gradient(circle,var(--blue-soft),transparent 70%)}.orbit:before{content:"";position:absolute;inset:16px;border:1px dashed color-mix(in srgb,var(--blue) 25%,var(--border));border-radius:50%;animation:spin 14s linear infinite}.orbit-center{display:grid;place-items:center;width:58px;height:58px;border:1px solid var(--border);border-radius:17px;background:var(--card);color:var(--blue);box-shadow:0 6px 24px var(--blue-soft)}.orbit-file{position:absolute;display:grid;place-items:center;width:31px;height:31px;border:1px solid var(--border);border-radius:7px;background:var(--card);box-shadow:0 5px 12px rgba(0,0,0,.08);font:8px ui-monospace,monospace;color:var(--muted)}.orbit-file:nth-child(2){top:0;left:25px;transform:rotate(-10deg)}.orbit-file:nth-child(3){right:-8px;top:55px;transform:rotate(9deg);color:#a56a17}.orbit-file:nth-child(4){bottom:2px;left:6px;transform:rotate(-7deg);color:var(--blue)}.scan-card h2{margin:0;font-size:15px;line-height:1.4}.scan-card p{margin:8px 0 0;color:var(--muted);font-size:10px;line-height:1.5}.scan-bar{width:100%;height:5px;margin-top:18px;border-radius:5px;background:var(--input);overflow:hidden}.scan-bar span{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,#75b6ff,var(--blue));transition:width .2s}.scan-card .quiet{margin-top:16px}.spin{animation:spin 1s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}@media(max-width:850px){.toolbar{position:relative;top:0;flex-wrap:wrap}.window{height:calc(100vh - 120px);min-height:650px}.screen{padding:25px 24px}.board,.scan-screen{grid-template-columns:1fr;gap:13px}.hero{align-items:flex-start;flex-direction:column;gap:12px}.hero h1{font-size:26px}.summary{align-items:flex-start;flex-direction:column;gap:11px}.bottom{align-items:flex-start;flex-direction:column}.bottom .actions{width:100%;justify-content:flex-end}.title{margin-left:0}.footer .progress{display:none}}
</style>

<body>
<div class="toolbar"><div class="brand"><span class="sun">✦</span><span>Dazzi onboarding</span></div><span class="spacer"></span><label>mode <select id="mode"><option value="recommend">추천 결과</option><option value="scan">사전 탐색</option></select></label><button class="icon" id="theme" aria-label="테마 전환">◐</button><button id="reset">처음부터</button></div>
<div class="shell"><main class="window" id="window"><header class="titlebar"><div class="traffic"><i></i><i></i><i></i></div><div class="title">Dazzi powered by AutoRAG</div></header><div class="stage" id="stage"></div><footer class="footer"><button class="back" id="back">‹</button><div class="progress"><span class="dot active"></span><span class="dot"></span><span class="dot"></span><span class="dot"></span></div><button class="primary" id="continue">범위 확정하고 계속 <span class="kbd">↵</span></button></footer><div id="overlay" hidden></div></main></div>
<script>
const ROOTS=[{id:'documents',name:'Documents',path:'~/Documents',files:21986,size:10.4,reason:'업무 문서와 개인 노트',icon:'file-text',selected:true},{id:'desktop',name:'Desktop',path:'~/Desktop',files:412,size:.8,reason:'최근 작업 자료',icon:'monitor',selected:true},{id:'icloud',name:'iCloud Drive',path:'~/iCloud Drive',files:1954,size:2.9,reason:'내려받은 문서만 · 온라인 전용 파일 제외',icon:'cloud',selected:true},{id:'downloads',name:'Downloads',path:'~/Downloads',files:5812,size:18.2,reason:'설치 파일과 임시 다운로드가 많아 기본 해제',icon:'download',selected:false},{id:'pictures',name:'Pictures',path:'~/Pictures',files:312,size:1.1,reason:'첫 인덱싱에서 OCR 사용 안 함',icon:'image',selected:false}];
const EXCEPTIONS=[{id:'codex',parent:'documents',path:'~/Documents/Codex',files:18800,size:4,reason:'반복되는 세션 이벤트와 도구 로그로 보입니다.',sample:'sessions/2026-10-15/session-018.jsonl',selected:true},{id:'build',parent:'desktop',path:'~/Desktop/Website/build',files:260,size:.4,reason:'생성된 번들과 소스맵이 반복돼요.',sample:'assets/index-7d3a.js.map',selected:true}];
const ICONS={folder:'▰',monitor:'▣',file:'▤',cloud:'☁',download:'↓',image:'▧',eye:'◉',lock:'⌑',brain:'◌',sparkles:'✦',check:'✓',plus:'＋',refresh:'↻',shield:'◇'};
const state={theme:'light',phase:'review',roots:structuredClone(ROOTS),exceptions:structuredClone(EXCEPTIONS)};
const icon=name=>`<span aria-hidden="true">${ICONS[name]||'•'}</span>`;
const total=()=>{const roots=state.roots.filter(root=>root.selected);const exceptions=state.exceptions.filter(item=>item.selected&&roots.some(root=>root.id===item.parent));const before=roots.reduce((sum,root)=>sum+root.files,0);const removed=exceptions.reduce((sum,item)=>sum+item.files,0);const files=before-removed;const size=roots.reduce((sum,root)=>sum+root.size,0)-exceptions.reduce((sum,item)=>sum+item.size,0);return {roots,exceptions,before,removed,files,size,oldMin:Math.max(1,Math.ceil(before/85)),min:Math.max(1,Math.ceil(files/85))};};
const folder=(root)=>`<label class="root ${root.selected?'selected':''}"><input type="checkbox" data-act="root" data-id="${root.id}" ${root.selected?'checked':''}><span class="check">${icon('check')}</span><span class="folder-icon">${icon(root.icon)}</span><span class="root-copy"><strong>${root.name}</strong><small><code>${root.path}</code><br>${root.reason}</small></span><span class="root-meta"><b>${root.files.toLocaleString('ko-KR')}</b>파일${root.id==='documents'?'<span>검색 가치 높음</span>':''}</span></label>`;
const exception=(item)=>`<label class="exception ${item.selected?'selected':''}"><input type="checkbox" data-act="exception" data-id="${item.id}" ${item.selected?'checked':''}><span class="check">${icon('check')}</span><span class="exception-copy"><strong>${item.path}<span class="pill">AI 추천</span></strong><small>${item.reason}</small><code>샘플 · ${item.sample}</code><span class="exception-impact">${item.files.toLocaleString('ko-KR')}개 파일 · ${item.size.toFixed(1)} GB</span></span></label>`;
function publishScope(){}
function render(){document.documentElement.dataset.theme=state.theme;const t=total();document.getElementById('stage').innerHTML=state.phase==='scan'?`<section class="screen scan-screen"><div><span class="eyebrow">${icon('sparkles')} 스마트 인덱싱</span><h1>파일을 읽기 전에<br>범위를 정리해요</h1><p style="color:var(--muted);font-size:12px;line-height:1.7">큰 폴더의 구조와 필요한 곳의 작은 샘플을 살펴보는 중입니다. 문서 파싱과 임베딩은 아직 시작하지 않았어요.</p></div><div class="scan-card"><div class="orbit"><span class="orbit-center">${icon('brain')}</span><span class="orbit-file">PDF</span><span class="orbit-file">JSONL</span><span class="orbit-file">MD</span></div><h2>세션 기록과 생성 파일을 구분하는 중</h2><p>추천을 만들기 전에는 인덱싱하지 않습니다.</p><div class="scan-bar"><span style="width:68%"></span></div><button class="quiet" id="cancel">취소하고 직접 설정</button></div></section>`:`<section class="screen"><div class="hero"><div class="hero-copy"><span class="eyebrow">${icon('sparkles')} 스마트 인덱싱 <b>추천 준비 완료</b></span><h1>찾을 문서만 남겨두었어요.</h1><p>큰 폴더는 포함하고, 그 안의 세션 기록과 생성 파일은 제외했어요. 이 화면에서 한 번만 확인하면 됩니다. 다음 화면에서 폴더를 다시 고르지 않습니다.</p></div><div class="status"><i></i>AI 범위 분석 완료</div></div><div class="board"><section class="pane"><div class="pane-head"><h2><span>${icon('folder')}</span>포함할 큰 폴더</h2><small>${t.roots.length}개 선택</small></div>${state.roots.filter(root=>['documents','desktop','icloud'].includes(root.id)||root.custom).map(folder).join('')}<details class="more"><summary>다른 위치 보기 · Downloads, Pictures</summary>${state.roots.filter(root=>!['documents','desktop','icloud'].includes(root.id)&&!root.custom).map(folder).join('')}</details><button class="add" id="addRoot">${icon('plus')} 다른 폴더 추가</button></section><section class="pane"><div class="pane-head"><h2><span>${icon('eye')}</span>그 안에서 제외</h2><small>${t.exceptions.length}개 경로</small></div><div class="exceptions">${state.exceptions.some(item=>t.roots.some(root=>root.id===item.parent))?state.exceptions.filter(item=>t.roots.some(root=>root.id===item.parent)).map(exception).join(''):'<div style="padding:25px 0;color:var(--muted);font-size:11px">선택한 폴더 안에 제외 후보가 없어요.</div>'}</div><div class="hidden-note">${icon('lock')}<span>.으로 시작하는 숨김 폴더는 기본 제외하며 샘플도 읽지 않습니다.</span></div></section></div><div class="summary"><div class="summary-main"><strong>${t.roots.length}개 큰 폴더 · ${t.files.toLocaleString('ko-KR')}개 파일 · ${t.size.toFixed(1)} GB</strong><small>${t.removed.toLocaleString('ko-KR')}개 파일을 제외했어요. 범위는 여기서 확정하고 다음 단계에서 임베딩 방식만 선택합니다.</small></div><div class="time"><del>약 ${t.oldMin}분</del><b>약 ${t.min}분</b><span class="saving">−${Math.round((t.oldMin-t.min)/t.oldMin*100)}%</span></div></div><div class="bottom"><button class="quiet" id="reanalyze">${icon('refresh')} 다시 분석</button><span>가상 파일·샘플·예상 시간 · 실제 파일/LLM 호출 없음</span><div class="actions"><button class="secondary" id="restore">추천으로 되돌리기</button><button class="primary" id="confirm">범위 확정하고 임베딩 설정으로 <span class="kbd">↵</span></button></div></div></section>`;bind();publishScope();}
function bind(){document.querySelectorAll('[data-act=root]').forEach(el=>el.addEventListener('change',()=>{const root=state.roots.find(root=>root.id===el.dataset.id);root.selected=el.checked;render();}));document.querySelectorAll('[data-act=exception]').forEach(el=>el.addEventListener('change',()=>{const item=state.exceptions.find(item=>item.id===el.dataset.id);item.selected=el.checked;render();}));document.getElementById('reanalyze')?.addEventListener('click',()=>{state.phase='scan';render();setTimeout(()=>{state.phase='review';render();},1400)});document.getElementById('cancel')?.addEventListener('click',()=>{state.phase='review';render();});document.getElementById('restore')?.addEventListener('click',()=>{state.roots=structuredClone(ROOTS);state.exceptions=structuredClone(EXCEPTIONS);render();});document.getElementById('confirm')?.addEventListener('click',()=>{document.querySelector('.footer .primary').textContent='임베딩 설정으로 이동 ✓';document.querySelector('.footer .primary').disabled=true;});document.getElementById('addRoot')?.addEventListener('click',()=>showModal());}
function showModal(){const overlay=document.getElementById('overlay');overlay.hidden=false;overlay.className='modal-scrim';overlay.innerHTML='<div class="modal"><h2>다른 폴더 추가</h2><p>프로토타입에서는 사용자 폴더 선택기 대신 예시 경로만 받습니다. 실제 구현에서는 OS 폴더 선택기를 사용합니다.</p><label>폴더 경로<input id="newPath" placeholder="~/Projects"></label><p class="error" id="error" hidden>~/로 시작하는 기존 범위와 겹치지 않는 경로를 입력하세요.</p><div class="modal-actions"><button class="secondary" id="closeModal">취소</button><button class="primary" id="savePath">추가</button></div></div>';document.getElementById('closeModal').onclick=()=>overlay.hidden=true;document.getElementById('savePath').onclick=()=>{const path=document.getElementById('newPath').value.trim();if(!path.startsWith('~/')||state.roots.some(root=>path===root.path||path.startsWith(root.path+'/'))){document.getElementById('error').hidden=false;return;}state.roots.push({id:`custom-${state.roots.length}`,name:path.split('/').pop(),path,files:640,size:1,reason:'직접 추가한 폴더',icon:'folder',selected:true});overlay.hidden=true;render();};}
document.getElementById('theme').onclick=()=>{state.theme=state.theme==='light'?'dark':'light';render();};document.getElementById('reset').onclick=()=>{state.phase='review';state.roots=structuredClone(ROOTS);state.exceptions=structuredClone(EXCEPTIONS);render();};document.getElementById('mode').onchange=e=>{state.phase=e.target.value==='scan'?'scan':'review';render();};render();
</script>
</body>
</html>
