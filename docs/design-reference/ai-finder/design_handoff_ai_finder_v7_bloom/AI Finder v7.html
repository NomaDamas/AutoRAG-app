function evidencePane(){const e=EV.find(x=>x.n===S.evidence)||EV[0];return `<aside class="inspector"><div class="inspector-head"><strong>Evidence</strong><span class="toolbar-spacer"></span><button class="icon-btn" data-openql>${icon('grid')}</button><button class="icon-btn" data-evidenceclose>${icon('close')}</button></div><div class="inspector-body"><div class="evidence-tabs">${EV.map(x=>`<button class="evidence-tab ${x.n===S.evidence?'active':''}" data-evidence="${x.n}">${x.n}</button>`).join('')}</div><div class="preview-paper">${previewFor({k:e.k,n:e.title,s:'',d:''})}</div><div class="preview-title">${e.n}. ${escape(e.title)}</div><div class="preview-sub">${escape(kind(e.k))} · ${escape(e.meta)}</div><div class="feedback"><button class="${S.feedback[e.n]==='up'?'on':''}" data-feedback="up">👍</button><button class="${S.feedback[e.n]==='down'?'on':''}" data-feedback="down">👎</button><button class="action" data-reveal="${e.n}">Show in Finder</button></div><div class="info-section"><div class="section-title">Excerpt</div><div class="excerpt"><h3>${escape(e.blocks[0])}</h3><p><mark>${escape(e.blocks[1])}</mark></p>${e.blocks[2]?`<p>${escape(e.blocks[2])}</p>`:''}<blockquote>${escape(e.meta)}</blockquote></div></div></div></aside>`}
function aiPane(){const open=S.ai,lastQ=[...S.messages].reverse().find(m=>m.role==='user');return `<aside class="ai ${open?'open':'collapsed'}${S.aiAnim?' anim-'+S.aiAnim:''}" style="--ai-h:${S.aiH}px">${open?'<div class="ai-grip" data-aigrip title="드래그해서 높이 조절"></div>':''}<div class="ai-head" data-aitoggle><span class="ai-mark">${icon('spark',14)}</span><strong>AI Search</strong>${open?'':`<span class="ai-peek">${escape(lastQ?lastQ.text:'파일, 메일, 메신저 전체에서 물어보세요')}</span><kbd>⌘K</kbd>`}<span class="spacer"></span>${open?`<button class="icon-btn" data-history title="Chat history">${icon('history')}</button><button class="icon-btn" data-newchat title="New chat">${icon('plus')}</button>`:''}<button class="icon-btn" title="${open?'AI Search 닫기':'AI Search 열기'}">${icon(open?'down':'up',15)}</button></div>${!open?'':`${S.history?`<div class="history"><input data-history-search placeholder="대화 기록 검색"><div class="history-list"><div class="history-group">오늘</div><button class="history-item current" data-loadchat><i class="hist-dot"></i><span class="hist-copy"><b>Q3 마케팅 예산 승인</b><small>최종 승인액과 승인자를 확인했습니다.</small></span><span class="hist-time">10:42</span></button><div class="history-group">어제</div><button class="history-item" data-loadchat><i class="hist-dot"></i><span class="hist-copy"><b>v1 vs v3 예산안 차이</b><small>총액이 4.2억에서 3.8억으로 줄었습니다.</small></span><span class="hist-time">17:30</span></button></div></div>`:''}<div class="ai-body">${S.messages.length?S.messages.map(m=>m.role==='user'?`<div class="message user-msg"><div class="bubble">${escape(m.text)}</div></div>`:`<div class="message"><div class="answer-label">AutoRAG</div><div class="answer-card"><div class="answer-head"><i></i><b>Quick</b><span class="answer-meta">${m.ready?m.a.quickMeta:'Searching…'}</span></div>${m.ready?m.a.quick.map(text=>`<p class="answer-text">${inline(text)}</p>`).join(''):'<div class="skeleton" style="width:90%"></div><div class="skeleton" style="width:70%"></div>'}</div><div class="answer-card deep"><div class="answer-head"><i></i><b>Deep</b><span class="answer-meta">${m.ready?m.a.deepMeta:'Reading documents…'}</span></div>${m.ready?m.a.deep.map(text=>`<p class="answer-text">${inline(text)}</p>`).join(''):'<div class="think">Thinking… · Searching sources · Cross-checking figures</div><div class="skeleton"></div><div class="skeleton" style="width:82%"></div>'}</div></div>`).join(''):`<div class="ai-empty"><strong>무엇을 찾아드릴까요?</strong><p>파일, 메일, Slack, Notion 전체에서 찾아 빠른 답변과 정확한 답변을 함께 드립니다.</p></div>`}</div><form class="composer" data-compose-form><div class="compose-box"><input data-compose value="${escape(S.draft)}" placeholder="파일, 메일, 메신저 전체에서 물어보세요" ${S.generating?'disabled':''}><button class="send" ${S.draft.trim()&&!S.generating?'':'disabled'}>${S.generating?'■':'↑'}</button></div></form>`}</aside>`}
function inline(text){return escape(text).replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/\[(\d+)\]/g,(m,n)=>`<button class="cite ${S.evidence===+n&&S.inspectorMode==='evidence'?'active':''}" data-evidence="${n}">${n}</button>`)}
function overlays(){let x='';if(S.quick){x+=`<div class="overlay" data-closequick><div class="modal quicklook"><div class="modal-head"><button class="icon-btn" data-closequick>${icon('close')}</button><strong>${escape(S.quick.n)}</strong><button class="action" data-ask="${escape(join(S.quick.where||tab().path,S.quick.n))}">Ask AI</button></div><div class="quick-body"><div class="quick-paper"><h2>${escape(S.quick.n)}</h2><p>${escape(kind(S.quick.k))} · ${escape(S.quick.s)}</p><hr><p>AutoRAG Finder Quick Look preview</p><p><mark>Q3 마케팅 예산과 관련된 문서 미리보기</mark></p></div></div></div></div>`}if(S.context){x+=`<div class="menu" style="left:${S.context.x}px;top:${S.context.y}px">${S.context.items.map((it,i)=>it==='-'?'<hr>':`<button class="${it.danger?'danger':''}" data-menuaction="${it.action}">${it.label}<span>${it.key||''}</span></button>`).join('')}</div>`}if(S.settings)x+=settingsModal();if(S.toast)x+=`<div class="toast">✓ ${escape(S.toast)}</div>`;return x}
function settingsModal(){return `<div class="overlay" data-settingsclose><section class="modal settings" onclick="event.stopPropagation()"><nav class="settings-nav"><div class="traffic"><i></i><i></i><i></i></div><h2>Settings</h2>${[['general','General'],['models','Models'],['sources','Data Sources']].map(x=>`<button class="${S.settingsTab===x[0]?'active':''}" data-settingtab="${x[0]}">${x[1]}</button>`).join('')}</nav><div class="settings-content"><div style="display:flex;justify-content:flex-end"><button class="icon-btn" data-settingsclose>${icon('close')}</button></div>${S.settingsTab==='general'?`<h3>General</h3><div class="settings-group"><div class="setting"><div class="setting-copy"><b>Language</b><small>앱 인터페이스 언어</small></div><select><option>한국어</option><option>English</option></select></div><div class="setting"><div class="setting-copy"><b>Global shortcut</b><small>어디서든 AutoRAG Agent 열기</small></div><kbd>⌥ Space</kbd></div><div class="setting"><div class="setting-copy"><b>Launch at login</b><small>Mac 로그인 시 자동 실행</small></div><button class="switch on"></button></div><div class="setting"><div class="setting-copy"><b>Show hidden files</b><small>숨김 파일·폴더를 목록에 표시</small></div><button class="switch ${S.showHidden?'on':''}" data-hidden></button></div><div class="setting"><div class="setting-copy"><b>중복 문서 스캔 주기</b><small>dupey가 중복·유사 문서 묶음을 다시 계산하는 간격</small></div><select><option>15분</option><option>1시간</option><option>24시간</option></select></div></div><h3>Software Update</h3><div class="settings-group"><div class="setting"><div class="setting-copy"><b>AutoRAG Agent 1.4.2</b><small>최신 버전입니다 · 방금 확인</small></div><button class="action">Check for Updates</button></div></div><h3>Privacy</h3><div class="settings-group"><div class="setting"><div class="setting-copy"><b>Clear chat history</b><small>저장된 모든 AI Search 대화를 삭제</small></div><button class="action">Clear…</button></div></div>`:S.settingsTab==='models'?`<h3>Models</h3><div class="settings-group"><div class="setting"><div class="source-tile">A</div><div class="setting-copy"><b>AutoRAG Agent</b><small>Connected model · Quick · Deep 공통</small></div></div></div><div class="settings-group"><div class="setting"><div class="setting-copy"><b>모델 설정을 도와드릴게요.</b><small>정확도, 속도, 데이터가 기기 밖으로 나가지 않는 것 중 선택하세요.</small></div></div></div>`:`<h3>Data Sources</h3><div class="settings-group">${['Local Files','iCloud Drive','Google Drive','Slack','Gmail','Notion','Discord'].map((n,i)=>`<div class="source-setting"><div class="source-top"><span class="source-tile">${n[0]}</span><div class="source-copy"><b>${n}</b><small>${i===2?'Syncing · 64%':'Indexed · 1m ago'}</small></div><button class="switch ${i===6?'':'on'}"></button></div><details><summary>Description</summary><p style="color:var(--muted);line-height:1.5">에이전트가 이 데이터소스를 언제 쓰면 좋은지에 대한 설명입니다. 인덱스와 연동 상태를 확인할 수 있습니다.</p></details></div>`).join('')}</div>`}</div></section></div>`}
function bind(){document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>navigate(b.dataset.nav));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>set({active:+b.dataset.tab,query:""}));document.querySelectorAll('[data-close]').forEach(b=>b.onclick=e=>{e.stopPropagation();closeTab(+b.dataset.close)});document.querySelector('[data-newtab]')?.addEventListener('click',newTab);document.querySelector('[data-back]')?.addEventListener('click',back);document.querySelector('[data-forward]')?.addEventListener('click',forward);document.querySelector('[data-inspector]')?.addEventListener('click',()=>set({inspector:!S.inspector}));document.querySelector('[data-ai]')?.addEventListener('click',()=>toggleAi(!S.ai));document.querySelector('[data-aitoggle]')?.addEventListener('click',e=>{if(e.target.closest('[data-history],[data-newchat]'))return;toggleAi(!S.ai)});document.querySelector('[data-aigrip]')?.addEventListener('mousedown',e=>{e.preventDefault();const pane=document.querySelector('.ai'),startY=e.clientY,startH=pane.offsetHeight,max=document.querySelector('.window').offsetHeight-220;let h=startH;pane.classList.add('resizing');document.body.style.cursor='ns-resize';const move=ev=>{h=Math.max(140,Math.min(max,startH+startY-ev.clientY));pane.style.setProperty('--ai-h',h+'px')};const up=()=>{document.removeEventListener('mousemove',move);document.removeEventListener('mouseup',up);document.body.style.cursor='';pane.classList.remove('resizing');S.aiH=h};document.addEventListener('mousemove',move);document.addEventListener('mouseup',up)});document.querySelectorAll('[data-version]').forEach(b=>b.onclick=()=>{const p=b.dataset.version,w=parent(p),x=findItem(w,base(p));if(!x)return;const head=famRole(p)?.f.head;set(s=>({expanded:{...s.expanded,[head]:true}}));if(tab().path!==w&&parent(head)!==tab().path)navigate(w);select({...x,where:w})});document.querySelector('[data-showindex]')?.addEventListener('click',()=>set({showIndex:!S.showIndex}));document.querySelectorAll('[data-pathql]').forEach(b=>b.onclick=()=>{const x=currentItem();if(x)set({quick:x})});document.querySelector('[data-search]')?.addEventListener('input',e=>set({query:e.target.value}));document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>set(s=>({tabs:s.tabs.map(t=>t.id===s.active?{...t,view:b.dataset.view}:t),view:b.dataset.view})));document.querySelectorAll('[data-crumb]').forEach(b=>b.onclick=()=>navigate(b.dataset.crumb));document.querySelectorAll('[data-open]').forEach(b=>{const pick=()=>{const p=b.dataset.open,w=parent(p),n=base(p),x=findItem(w,n)||findItem(tab().path,n);return x?{...x,where:w||tab().path}:null};b.onclick=()=>{const x=pick();if(!x)return;if(x.k==='folder'&&S.view==='columns'){navigate(join(x.where,x.n));return}select(x)};b.ondblclick=()=>{const x=pick();if(!x)return;if(x.k==='folder')navigate(join(x.where,x.n));else set({quick:{...x}})}});document.querySelector('[data-collapse]')?.addEventListener('click',()=>set({sidebar:!S.sidebar}));document.querySelectorAll('[data-copy]').forEach(b=>b.onclick=()=>{navigator.clipboard?.writeText(b.dataset.copy);showToast('경로를 복사했습니다')});document.querySelectorAll('[data-openfolder]').forEach(b=>b.onclick=e=>{e.stopPropagation();set(s=>({expanded:{...s.expanded,[b.dataset.openfolder]:!s.expanded[b.dataset.openfolder]}}))});document.querySelectorAll('[data-index]').forEach(b=>b.onclick=e=>{e.stopPropagation();const p=b.dataset.index,w=parent(p),x=findItem(w,base(p));if(x)toggleIndex({...x,where:w})});document.querySelectorAll('[data-trash]').forEach(b=>b.onclick=()=>{const p=b.dataset.trash,w=parent(p),x=findItem(w,base(p));if(x)trash({...x,where:w})});document.querySelectorAll('[data-ask]').forEach(b=>b.onclick=()=>{const p=b.dataset.ask,w=parent(p),x=findItem(w,base(p));if(x)ask({...x,where:w});});document.querySelectorAll('[data-openql]').forEach(b=>b.onclick=()=>{const x=currentItem();if(x)set({quick:{...x,where:tab().selWhere||tab().path}})});document.querySelectorAll('[data-closequick]').forEach(b=>b.onclick=e=>{if(e.target===b||b.dataset.closequick!==undefined)set({quick:null})});document.querySelectorAll('[data-evidence]').forEach(b=>b.onclick=()=>openEvidence(+b.dataset.evidence));document.querySelector('[data-evidenceclose]')?.addEventListener('click',()=>set({inspectorMode:'info'}));document.querySelectorAll('[data-reveal]').forEach(b=>b.onclick=()=>reveal(EV.find(x=>x.n===+b.dataset.reveal)));document.querySelectorAll('[data-feedback]').forEach(b=>b.onclick=()=>set(s=>({feedback:{...s.feedback,[s.evidence]:s.feedback[s.evidence]===b.dataset.feedback?null:b.dataset.feedback}})));document.querySelector('[data-compose-form]')?.addEventListener('submit',e=>{e.preventDefault();send()});document.querySelector('[data-compose]')?.addEventListener('input',e=>{S.draft=e.target.value;document.querySelector('.send').disabled=!S.draft.trim()});document.querySelector('[data-history]')?.addEventListener('click',()=>set({history:!S.history}));document.querySelector('[data-newchat]')?.addEventListener('click',()=>set({messages:[],draft:"",history:false}));document.querySelectorAll('[data-loadchat]').forEach(b=>b.onclick=()=>set({history:false,messages:[{role:'user',text:A1.q},{role:'assistant',a:A1,ready:true}]}));document.querySelector('[data-settings]')?.addEventListener('click',()=>set({settings:true}));document.querySelectorAll('[data-settingsclose]').forEach(b=>b.onclick=()=>set({settings:false}));document.querySelectorAll('[data-settingtab]').forEach(b=>b.onclick=()=>set({settingsTab:b.dataset.settingtab}));document.querySelector('[data-hidden]')?.addEventListener('click',()=>set({showHidden:!S.showHidden}));document.querySelector('[data-newfolder]')?.addEventListener('click',newFolderMock);document.querySelector('[data-sort]')?.addEventListener('click',()=>showToast('정렬: 이름 · 수정일 · 크기'));document.querySelectorAll('[data-sortkey]').forEach(b=>b.onclick=()=>setSort(b.dataset.sortkey));document.querySelectorAll('[data-row]').forEach(b=>{b.oncontextmenu=e=>{e.preventDefault();const p=b.dataset.row,w=parent(p),x=findItem(w,base(p));if(x)set(s=>({tabs:s.tabs.map(t=>t.id===s.active?{...t,sel:x.n,selWhere:w}:t),context:{x:e.clientX,y:e.clientY,items:[{label:x.k==='folder'?'열기':'Quick Look',action:x.k==='folder'?'open':'quick',key:x.k==='folder'?'↩':'space'},'-',{label:'복사',action:'copy',key:'⌘C'},{label:'이름 변경',action:'rename',key:''},'-',{label:'휴지통으로 이동',action:'trash',key:'⌫',danger:true}]}}))}});document.querySelectorAll('[data-menuaction]').forEach(b=>b.onclick=()=>{const x=currentItem();const a=b.dataset.menuaction;set({context:null});if(!x)return;if(a==='quick')set({quick:x});if(a==='trash')trash(x);if(a==='copy')showToast('항목을 복사했습니다');if(a==='rename')showToast('이름 변경은 실제 앱에서 사용할 수 있습니다');if(a==='open')navigate(join(x.where,x.n))});document.querySelector('[data-infotoggle]')?.addEventListener('click',()=>set({infoLess:!S.infoLess}));document.addEventListener('mousedown',outside,{once:true})}
function outside(e){if(S.context&&!e.target.closest('.menu'))set({context:null})}
window.addEventListener('keydown',e=>{const typing=/input|textarea|select/i.test(e.target.tagName);const m=e.metaKey||e.ctrlKey;if(e.key==='Escape'){if(S.quick)return set({quick:null});if(S.settings)return set({settings:false});if(S.history)return set({history:false});if(S.context)return set({context:null});if(S.inspectorMode==='evidence')return set({inspectorMode:'info'});if(S.query&&!typing)return set({query:""})}if(m&&e.key.toLowerCase()==='f'){e.preventDefault();document.querySelector('[data-search]')?.focus()}if(m&&e.key.toLowerCase()==='t'){e.preventDefault();newTab()}if(m&&e.key.toLowerCase()==='k'){e.preventDefault();toggleAi(true);document.querySelector('[data-compose]')?.focus()}if(m&&e.key===','){e.preventDefault();set({settings:true})}if(m&&e.key.toLowerCase()==='i'){e.preventDefault();set({inspector:!S.inspector})}if(e.altKey&&/^[1-9]$/.test(e.key)){e.preventDefault();openEvidence(+e.key)}if(!typing&&(e.key==='ArrowDown'||e.key==='ArrowUp')&&!S.settings&&!S.quick){e.preventDefault();const list=S.view==='list'||S.query.trim()?flatten(rows(),0).map(([x])=>x):rows();if(!list.length)return;const cur=currentItem();const i=cur?list.findIndex(x=>x.n===cur.n&&x.where===cur.where):-1;const n=list[Math.min(list.length-1,Math.max(0,i<0?0:i+(e.key==='ArrowDown'?1:-1)))];select(n);return}if(!typing&&e.key==='Enter'&&!S.settings){const x=currentItem();if(x){e.preventDefault();if(x.k==='folder')navigate(join(x.where,x.n));else set({quick:x})}return}if(!typing&&e.key===' '){e.preventDefault();const x=currentItem();if(x)set({quick:{...x,where:tab().selWhere||tab().path}})}if(!typing&&(e.key==='Delete'||e.key==='Backspace')){const x=currentItem();if(x)trash({...x,where:tab().selWhere||tab().path})}});
render();
}
App();
})();
</script></body></html>
