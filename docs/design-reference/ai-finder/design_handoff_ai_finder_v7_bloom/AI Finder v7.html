.settings-nav-item{display:flex;align-items:center;gap:9px;width:100%;height:32px;border:0;border-radius:7px;background:transparent;padding:0 10px;font-size:13px;font-weight:400;color:var(--body);cursor:pointer;text-align:left;transition:background .12s}

.linear-desc{font-size:13px;font-weight:400;color:var(--muted);line-height:1.5;margin:0}
.linear-section-title{font-size:14.5px;font-weight:600;color:var(--ink);margin:30px 0 4px;letter-spacing:-.005em}
.linear-section-desc{font-size:12px;font-weight:400;color:var(--muted);margin:0 0 10px;line-height:1.4}
.linear-row{display:flex;align-items:flex-start;justify-content:space-between;padding:15px 0;border-bottom:1px solid var(--line2);gap:24px}
.linear-row:last-child{border-bottom:0}
.linear-row-label{flex:1;min-width:0}
.linear-row-label b,
.linear-row-label .linear-row-name{display:block;font-size:13.5px;font-weight:400;color:var(--ink);line-height:1.35}
.linear-row-label small{display:block;font-size:12.5px;font-weight:400;color:var(--muted);line-height:1.45;margin-top:3px}
.linear-control{flex:none;display:flex;align-items:center;gap:10px}
.linear-select{height:30px;padding:0 24px 0 10px;border:1px solid var(--line);border-radius:6px;background:#f7f7f9;color:var(--ink);font-size:12px;font-weight:400;outline:0;cursor:pointer}
.linear-btn{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--ink);font-size:12px;font-weight:400;cursor:pointer;transition:all .12s}
.linear-btn:hover{background:#f5f5f7;border-color:#c7c7cc}
.linear-btn.danger{color:var(--red);border-color:#ffd0ce;background:#fff9f9}
.linear-btn.danger:hover{background:#fee2e2;border-color:#fca5a5}
.linear-textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:#fbfbfc;font-size:12.5px;font-weight:400;color:var(--ink);line-height:1.5;outline:0;resize:vertical}
.linear-textarea:focus{border-color:#0a64d8;background:#fff}

.provider-quick-bar{display:flex;gap:10px;margin:16px 0 24px;flex-wrap:wrap}
.provider-quick-btn{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px;border-radius:18px;border:1px solid #dcdde1;background:#fff;font-size:12px;font-weight:400;color:var(--ink);cursor:pointer;transition:all .15s;box-shadow:0 1px 2px rgba(0,0,0,.03)}
.provider-quick-btn:hover{border-color:#0a64d8;background:#f5f9ff;color:#0a64d8}
.provider-list{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.provider-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border:1px solid #e7e7eb;border-radius:10px;background:#fff;transition:all .15s}

.provider-icon{width:34px;height:34px;border-radius:8px;background:#f0f1f4;display:grid;place-items:center;font-size:13px;font-weight:500;color:var(--ink);flex:none}

.provider-name{font-size:13.5px;font-weight:400;color:var(--ink);display:flex;align-items:center;gap:6px}

.provider-status.disconnected{background:#f3f3f5;color:#6e6e73;border-color:#e4e4e7}
.provider-status.disconnected i{width:6px;height:6px;border-radius:50%;background:#8e8e93}
.provider-status.checking{background:#fff8e6;color:#b45309;border-color:#fde68a}
.provider-status.checking i{width:6px;height:6px;border-radius:50%;background:#f59e0b}

.search-wrap{position:relative;display:flex;align-items:center}
.search{width:210px;height:29px;display:flex;align-items:center;gap:6px;background:#ededf0;border:1px solid transparent;border-radius:8px;padding:0 8px;color:var(--muted);position:relative;transition:all .15s}
.search:focus-within,.search.active{background:#fff;border-color:var(--blue2);box-shadow:0 0 0 3px rgba(10,100,216,.15)}
.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;font-size:12px;color:var(--ink)}
.search-clear{width:16px;height:16px;border-radius:50%;border:0;background:#c7c7cc;color:#fff;display:inline-grid;place-items:center;padding:0;cursor:pointer;font-size:9px;line-height:1}
