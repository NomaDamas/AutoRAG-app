<!doctype html>
<html lang="ko" data-appearance="light">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#F2F2F7">
    <title>Dazzi · 모바일 원격 접속 시안</title>
    <link rel="stylesheet" href="../../../src/renderer/styles/fonts.css">
    <link rel="stylesheet" href="../../../src/renderer/styles/tokens.css">
    <link rel="stylesheet" href="./prototype.css">
    <script src="./icons.js" defer></script>
    <script src="./data.js" defer></script>
    <script src="./core.js" defer></script>
    <script src="./views.js" defer></script>
    <script src="./overlays.js" defer></script>
    <script src="./settings.js" defer></script>
    <script src="./main.js" defer></script>
  </head>
  <body>
    <aside class="review" aria-label="시안 조작">
      <header>
        <strong>Dazzi 모바일 원격 접속 시안</strong>
        <span>폭 500px 이하에서 열면 기기 화면 전체로 그립니다.</span>
      </header>
      <section>
        <h2>장면</h2>
        <div class="review-grid" id="scenes"></div>
      </section>
      <section>
        <h2>보기</h2>
        <div class="review-grid">
          <button class="rbtn" type="button" data-review="theme" id="theme-toggle">다크 모드</button>
          <button class="rbtn" type="button" data-review="reset">처음 상태로</button>
        </div>
      </section>
      <section class="review-notes">
        <h2>조작</h2>
        <ul>
          <li>행을 <b>길게 누르거나</b> 우클릭 → 빠른 메뉴</li>
          <li>행을 <b>왼쪽으로 밀기</b> → 휴지통 · 더보기</li>
          <li>오른쪽 <b>⋯</b> 버튼 → 같은 메뉴 (한 손 대안)</li>
          <li>제목 옆 <b>⌄</b> → 상위 경로 이동</li>
        </ul>
      </section>
    </aside>
    <main class="stage">
      <div class="device" id="device">
        <div class="screen" id="screen"></div>
      </div>
    </main>
  </body>
</html>
