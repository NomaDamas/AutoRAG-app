name: Release

# Publishing a GitHub release builds the macOS .dmg and the Windows installer
# .exe, each carrying the app, every dependency program, and the local embedding
# model, attaches them to that release, and — when its variables and secrets
# exist — mirrors the same files to a Cloudflare R2 bucket for CDN-backed
# downloads. See docs/release.md.
#
#   gh release create v1.2.3 --generate-notes     # -> this workflow
#
# `workflow_dispatch` builds the same installers from any ref without a release
# (they land as workflow artifacts, nothing is published): a release rehearsal.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (v1.2.3). Defaults to v0.0.0-dev.<run number>.
        required: false
        type: string

permissions:
  contents: write # attach the installers to the release

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

env:
  # The tag is the version: the release's tag, else the manual input, else a dev number.
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version || format('v0.0.0-dev.{0}', github.run_number) }}
  # The auto-update feed the packaged app polls (docs/release.md → "Auto-update"). Builds get it only
  # when the R2 mirror is configured; without a feed the app never checks.
  AUTORAG_UPDATE_FEED_URL: ${{ vars.R2_BUCKET != '' && 'https://dl.nomadamas.org/latest/' || '' }}

# Runners are repository variables (Settings > Secrets and variables > Actions > Variables) holding
# a JSON value: RELEASE_RUNNER_MAC / RELEASE_RUNNER_WIN = "macos-15" or ["self-hosted","macOS","ARM64"].
# Unset = GitHub-hosted. docs/release.md explains when to point them at your own machines.

jobs:
  macos:
    # A release that already carries the Mac dmg was built locally (docs/release.md → "Local Mac
    # release"); mac-prebuilt mirrors it instead of building a second, different one.
    if: ${{ github.event_name != 'release' || !contains(join(github.event.release.assets.*.name, ','), '-arm64.dmg') }}
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_MAC || '"macos-15"') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@stable

      # `bun install` resolves the `file:./.upstream/autorag` dependency before
      # its `preinstall` hook runs, so the librarian is cloned and built first.
      - name: Sync librarian
        run: node scripts/sync-librarian.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stamp version
        run: node scripts/release/set-version.mjs "$RELEASE_TAG"

      # Only the suites that guard what the installer adds. The full suite runs on main;
      # gating a release on unrelated failures would block shipping a fix.
      - name: Test packaging runtime
        env:
          AUTORAG_SKIP_DUPEY_CHECK: "1"
        run: bunx vitest run test/bundled-tools.test.ts test/refresh-schedule.test.ts
      - name: Build app
        env:
          AUTORAG_SKIP_DUPEY_CHECK: "1"
          # A public write-only key, not a secret; unset leaves error reporting out of the build.
          MAIN_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          # A public write-only key, not a secret; unset leaves usage statistics out of the build.
          MAIN_VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          MAIN_VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: bun run build

      - name: Stage dependency tools and embedding model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/stage-tools.mjs
      - name: Verify the staged tools run on a bare PATH
        run: node scripts/release/verify-bundle.mjs build/stage/darwin-arm64/tools --seed build/stage/darwin-arm64/seed

      # Signing and notarization switch on by themselves when these secrets exist;
      # without them the .dmg is ad-hoc signed (it runs, but Gatekeeper warns).
      - name: Import Apple notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "no APPLE_API_KEY_P8: skipping notarization key"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Package .dmg and update .zip
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        # @electron/osx-sign opens every file of the bundle at once to find the binaries (an unbounded
        # Promise.all over ~130k files), so signing fails with EMFILE once the process passes the
        # kernel's per-process cap (observed in run 38380649023). Raise the kernel caps (GitHub-hosted
        # runners allow passwordless sudo; a self-hosted Mac without it keeps its own limits), then
        # the shell's limit up to them.
        run: |
          sudo -n sysctl -w kern.maxfiles=524288 kern.maxfilesperproc=262144 || echo "cannot raise kern.maxfiles* (no passwordless sudo)"
          ulimit -n "$(sysctl -n kern.maxfilesperproc)" || ulimit -n "$(ulimit -Hn)"
          echo "file descriptors: soft $(ulimit -n), hard $(ulimit -Hn), per-process cap $(sysctl -n kern.maxfilesperproc)"
          bun run release:pack:mac

      - name: Smoke-test the installed app
        run: node scripts/release/smoke-installed.mjs

      - name: Name release files
        run: |
          mkdir -p upload update
          cp dist/*.dmg upload/
          cp build/stage/darwin-arm64/tools/manifest.json upload/components-macos-arm64.json
          (cd upload && shasum -a 256 *.dmg > SHA256SUMS-macos.txt)
          # Auto-update payloads: CDN only (the feed points there; GitHub caps an asset at 2 GiB).
          cp dist/*.zip dist/*.blockmap update/
          if [ -n "$AUTORAG_UPDATE_FEED_URL" ]; then node scripts/release/update-feed.mjs dist feed; fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            upload/*
            update/*
            feed/*
          retention-days: 14
      - name: Attach to the release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
      - name: Sync installers to the R2 mirror
        if: ${{ github.event_name == 'release' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        shell: bash
        run: bash scripts/release/sync-r2.sh "$RELEASE_TAG" upload update feed

  mac-prebuilt:
    if: ${{ github.event_name == 'release' && contains(join(github.event.release.assets.*.name, ','), '-arm64.dmg') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The local build attached the update payload and feed too, because they reach R2 only from here.
      # They leave the release once mirrored: the feed never points at GitHub, and the zip can outgrow
      # GitHub's 2 GiB asset cap.
      - name: Download the locally built Mac files
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p upload update feed
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir upload -p '*-arm64.dmg' -p 'components-macos-arm64.json' -p 'SHA256SUMS-macos.txt'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir update -p '*-arm64.zip' -p '*-arm64.zip.blockmap'
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir feed -p '*-mac.yml'
          (cd upload && sha256sum --check SHA256SUMS-macos.txt)
          ls -l upload update feed
      - name: Sync installers to the R2 mirror
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        run: bash scripts/release/sync-r2.sh "$RELEASE_TAG" upload update feed
      - name: Remove the update payload from the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for asset in update/* feed/*; do
            gh release delete-asset "$RELEASE_TAG" "$(basename "$asset")" --repo "$GITHUB_REPOSITORY" --yes
          done

  windows:
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_WIN || '"windows-2022"') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # slacrawl and notcrawl publish no Windows archive, so they are built from source with Go.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable

      - name: Sync librarian
        run: node scripts/sync-librarian.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stamp version
        run: node scripts/release/set-version.mjs "$env:RELEASE_TAG"

      - name: Test packaging runtime
        env:
          AUTORAG_SKIP_DUPEY_CHECK: "1"
        run: bunx vitest run test/bundled-tools.test.ts test/refresh-schedule.test.ts
      - name: Build app
        env:
          AUTORAG_SKIP_DUPEY_CHECK: "1"
          # A public write-only key, not a secret; unset leaves error reporting out of the build.
          MAIN_VITE_SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          # A public write-only key, not a secret; unset leaves usage statistics out of the build.
          MAIN_VITE_POSTHOG_KEY: ${{ vars.POSTHOG_KEY }}
          MAIN_VITE_POSTHOG_HOST: ${{ vars.POSTHOG_HOST }}
        run: bun run build

      - name: Stage dependency tools and embedding model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/stage-tools.mjs
      - name: Verify the staged tools run on a bare PATH
        run: node scripts/release/verify-bundle.mjs build/stage/win32-x64/tools --seed build/stage/win32-x64/seed

      # Azure Trusted Signing switches on when these secrets exist; without them
      # the installer is unsigned and Windows SmartScreen warns.
      - name: Package installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODESIGN_ENDPOINT: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
          AZURE_CODESIGN_PROFILE: ${{ vars.AZURE_CODESIGN_PROFILE }}
        run: bun run release:pack:win

      - name: Smoke-test the installed app
        run: node scripts/release/smoke-installed.mjs

      - name: Name release files
        shell: bash
        run: |
          mkdir -p upload update
          cp dist/*.exe upload/
          cp build/stage/win32-x64/tools/manifest.json upload/components-windows-x64.json
          (cd upload && sha256sum *.exe > SHA256SUMS-windows.txt)
          # The installer is the update payload too; its blockmap (from the same build) drives the differential download.
          cp dist/*.exe.blockmap update/
          if [ -n "$AUTORAG_UPDATE_FEED_URL" ]; then node scripts/release/update-feed.mjs dist feed; fi
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            upload/*
            update/*
            feed/*
          retention-days: 14
      - name: Attach to the release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: upload/*
      - name: Sync installers to the R2 mirror
        if: ${{ github.event_name == 'release' }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ vars.R2_ENDPOINT }}
          R2_BUCKET: ${{ vars.R2_BUCKET }}
        shell: bash
        run: bash scripts/release/sync-r2.sh "$RELEASE_TAG" upload update feed

  # Point the Homebrew cask (NomaDamas/homebrew-dazzi) at the published dmg. Runs for stable vX.Y.Z
  # releases only, after the Mac dmg is on the release (built here or locally), and skips without
  # the HOMEBREW_TAP_TOKEN secret (a fine-grained PAT with contents:write on the tap repository).
  homebrew:
    needs: [macos, mac-prebuilt]
    if: ${{ !cancelled() && github.event_name == 'release' && (needs.macos.result == 'success' || needs.mac-prebuilt.result == 'success') && !github.event.release.prerelease && !contains(github.event.release.tag_name, '-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Update the cask
        env:
          GH_TOKEN: ${{ github.token }}
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then echo "no HOMEBREW_TAP_TOKEN: skipping the Homebrew cask"; exit 0; fi
          mkdir upload
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir upload -p 'SHA256SUMS-macos.txt'
          sha=$(awk '/-arm64\.dmg$/ {print $1}' upload/SHA256SUMS-macos.txt)
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/NomaDamas/homebrew-dazzi.git" tap
          mkdir -p tap/Casks
          node scripts/release/render-cask.mjs "$RELEASE_TAG" "$sha" > tap/Casks/dazzi.rb
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/dazzi.rb
          git diff --cached --quiet && { echo "cask already current"; exit 0; }
          git commit -m "dazzi ${RELEASE_TAG#v}"
          git push origin HEAD:main
