name: Release

# Creating (publishing) a GitHub release builds the macOS .dmg and the Windows
# installer .exe, each carrying the app, every dependency program, and the
# local embedding model, and attaches them to that release. See docs/release.md.
#
#   gh release create v1.2.3 --generate-notes     # -> this workflow
#
# `workflow_dispatch` builds the same artifacts from any ref without a release
# (they land as workflow artifacts, nothing is published), which is how a
# release candidate is rehearsed.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp (v1.2.3). Defaults to 0.0.0-dev.<run number>.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name || github.ref }}
  cancel-in-progress: false

# Runners are repository variables (Settings > Secrets and variables > Actions > Variables) holding
# a JSON value: RELEASE_RUNNER_MAC / RELEASE_RUNNER_WIN = "macos-15" or ["self-hosted","macOS","ARM64"].
# Unset = GitHub-hosted. docs/release.md explains when to point them at your own machines.

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
    steps:
      - id: v
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          tag="${RELEASE_TAG:-$INPUT_VERSION}"
          if [ -z "$tag" ]; then tag="v0.0.0-dev.${GITHUB_RUN_NUMBER}"; fi
          if ! echo "$tag" | grep -Eq '^v?[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$'; then
            echo "::error::'$tag' is not a version tag (v1.2.3 or v1.2.3-rc.1)"; exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  macos:
    needs: version
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_MAC || '"macos-15"') }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable

      # `bun install` resolves the `file:./.upstream/autorag` dependency before
      # its `preinstall` hook runs, so the librarian is cloned and built first.
      - name: Sync librarian
        run: node scripts/sync-librarian.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stamp version
        run: node scripts/release/set-version.mjs "${{ needs.version.outputs.tag }}"

      - name: Test
        env:
          AUTORAG_SKIP_DUPEY_CHECK: "1"
        run: bun run test
      - name: Build app
        env:
          AUTORAG_SKIP_DUPEY_CHECK: "1"
        run: bun run build

      - name: Stage dependency tools and embedding model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/stage-tools.mjs
      - name: Verify the staged tools run on a bare PATH
        run: node scripts/release/verify-bundle.mjs build/stage/darwin-arm64/tools --seed build/stage/darwin-arm64/seed

      # Signing and notarization switch on by themselves when these secrets exist;
      # without them the .dmg is ad-hoc signed (runs, but Gatekeeper warns).
      - name: Import Apple notarization key
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then echo "no APPLE_API_KEY_P8: skipping notarization key"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/apple"
          printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/apple/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/apple/AuthKey.p8" >> "$GITHUB_ENV"
      - name: Package .dmg
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: bun run release:pack:mac

      - name: Smoke-test the installed app
        run: node scripts/release/smoke-installed.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dmg
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: component-manifest-macos
          path: build/stage/darwin-arm64/tools/manifest.json

  windows:
    needs: version
    runs-on: ${{ fromJSON(vars.RELEASE_RUNNER_WIN || '"windows-2022"') }}
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - uses: dtolnay/rust-toolchain@stable

      - name: Sync librarian
        run: node scripts/sync-librarian.mjs
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Stamp version
        run: node scripts/release/set-version.mjs "${{ needs.version.outputs.tag }}"

      - name: Test
        env:
          AUTORAG_SKIP_DUPEY_CHECK: "1"
        run: bun run test
      - name: Build app
        env:
          AUTORAG_SKIP_DUPEY_CHECK: "1"
        run: bun run build

      - name: Stage dependency tools and embedding model
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/release/stage-tools.mjs
      - name: Verify the staged tools run on a bare PATH
        run: node scripts/release/verify-bundle.mjs build/stage/win32-x64/tools --seed build/stage/win32-x64/seed

      # Azure Trusted Signing switches on when these secrets exist; without them
      # the installer is unsigned and Windows SmartScreen warns.
      - name: Package installer
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_CODESIGN_ENDPOINT: ${{ vars.AZURE_CODESIGN_ENDPOINT }}
          AZURE_CODESIGN_ACCOUNT: ${{ vars.AZURE_CODESIGN_ACCOUNT }}
          AZURE_CODESIGN_PROFILE: ${{ vars.AZURE_CODESIGN_PROFILE }}
        run: bun run release:pack:win

      - name: Smoke-test the installed app
        run: node scripts/release/smoke-installed.mjs

      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: component-manifest-windows
          path: build/stage/win32-x64/tools/manifest.json

  publish:
    # Only a published release attaches files; a manual run stops at workflow artifacts.
    if: ${{ github.event_name == 'release' }}
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: assets
      - name: Collect release files
        run: |
          mkdir -p upload
          cp assets/macos-dmg/*.dmg upload/
          cp assets/windows-installer/*.exe upload/
          cp assets/component-manifest-macos/manifest.json upload/components-macos-arm64.json
          cp assets/component-manifest-windows/manifest.json upload/components-windows-x64.json
          (cd upload && sha256sum * > SHA256SUMS.txt)
          ls -la upload
      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" upload/* --clobber --repo "$GITHUB_REPOSITORY"
