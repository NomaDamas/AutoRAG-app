name: QA (Windows)

# Issue #57: run the manual-QA sweep on Windows so macOS-only assumptions and
# Windows regressions are caught automatically. The lanes share one helper
# (`scripts/manual-qa/platform.mjs`) and one entry point
# (`scripts/manual-qa/run-all.mjs`).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  qa-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install ffmpeg
        run: choco install ffmpeg -y --no-progress

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Unit tests
        run: bun run test

      - name: Typecheck
        run: bun run typecheck

      - name: Build
        run: bun run build

      - name: QA sweep
        env:
          AUTORAG_SKIP_NATIVE_CAPTURE: "1"
        run: bun scripts/manual-qa/run-all.mjs

      - name: Upload QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-windows-evidence
          path: |
            .omo/evidence/win-qa
          if-no-files-found: ignore
