name: tmp tar probe
on:
  push:
    branches: [fix/release-0.2.0-build]
    paths: [.github/workflows/tmp-tar-probe.yml]
jobs:
  probe:
    runs-on: windows-2022
    steps:
      - name: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Continue"
          $sys = Join-Path $env:SystemRoot "System32\tar.exe"
          $root = Join-Path $env:RUNNER_TEMP "probe"
          New-Item -ItemType Directory -Force "$root\app\node_modules\kordoc\templates" | Out-Null
          New-Item -ItemType Directory -Force "$root\app\node_modules\kordoc\dist" | Out-Null
          New-Item -ItemType Directory -Force "$root\tools\node" | Out-Null
          $name = -join ([char]0xAC04, [char]0xC774, [char]0xAE30, [char]0xC548, [char]0xBB38) + ".hwpx"
          Set-Content "$root\app\node_modules\kordoc\templates\$name" "x"
          Set-Content "$root\app\node_modules\kordoc\templates\plain.json" "x"
          Set-Content "$root\app\node_modules\kordoc\dist\index.js" "x"
          Set-Content "$root\tools\node\node.exe" "x"
          function Try-Tar($label, $tarArgs) { & $sys @tarArgs; Write-Host "RESULT $label exit=$LASTEXITCODE" }
          Try-Tar "exclude dir" @("-cf", "$root\e.tar", "-C", $root, "--exclude=app/node_modules/kordoc/templates", "app/node_modules", "tools/node")
          Write-Host "LISTING:"; & $sys -tf "$root\e.tar"
          Try-Tar "extract" @("-xf", "$root\e.tar", "-C", "$root\x")
          New-Item -ItemType Directory -Force "$root\x" | Out-Null
          Try-Tar "extract2" @("-xf", "$root\e.tar", "-C", "$root\x")
          Get-ChildItem "$root\x" -Recurse -File | ForEach-Object { Write-Host "EXTRACTED $($_.FullName.Substring($root.Length))" }
