# Dazzi native Rust core — hot-path functions identified and verified via fast-anything.
[package]
name = "dazzi-native-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "dazzi_native_core"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
unicode-normalization = "0.1"
zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.37"
encoding_rs = "0.8"
png = "0.17"
tiff = "0.9"
tar = "0.4"
flate2 = "1"
lopdf = { version = "0.34", default-features = false, features = ["nom_parser"] }
plist = "1"
serde_json = "1"

[target.'cfg(unix)'.dependencies]
xattr = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_System_Registry", "Win32_Foundation"] }

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
