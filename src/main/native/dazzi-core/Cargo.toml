# Dazzi native Rust core — hot-path functions identified and verified via fast-anything.
[package]
name = "dazzi-native-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
name = "dazzi_native_core"
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3", features = ["serde-json"] }
napi-derive = "3"
unicode-normalization = "0.1"

[build-dependencies]
napi-build = "2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "unwind"
